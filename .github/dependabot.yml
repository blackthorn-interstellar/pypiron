# Python deps are deliberately absent here: the nightly deps lane
# (.github/workflows/nightly-deps.yml) owns them, running
# `uv lock --upgrade --exclude-newer` every night with a 14-day release-age
# cooldown and landing one self-merging lockfile PR instead of a stream of them.
# A "uv"/"pip" ecosystem below would duplicate that and fight over uv.lock.
# Cargo and the actions pins stay here.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    # A freshly published crate is where a supply-chain compromise is caught, so
    # wait a month before proposing it. One grouped PR a month, not a stream.
    cooldown:
      default-days: 30
    groups:
      all-cargo:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 30
    groups:
      all-actions:
        patterns:
          - "*"
