[package]
name = "pypiron"
# Permanent placeholder: real versions come from git tags (vX.Y.Z).
# CI stamps the tag version in before building wheels. See dev/RELEASE.md.
version = "0.0.0"
edition = "2021"
description = "Ultra-fast self-hosted PyPI server and mirror in Rust — private index, proxy cache, supply-chain defense. One binary, no database."
homepage = "https://pypiron.com"
repository = "https://github.com/blackthorn-interstellar/pypiron"
readme = "README.md"
license = "MIT"
keywords = ["pypi", "package-registry", "mirror", "self-hosted", "python"]
categories = ["development-tools", "web-programming"]

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["macros", "json", "multipart"] }
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
futures = "0.3"
http = "1"
# Already in the tree via hyper-util; used directly for --proxy-allow-cidr.
ipnet = "2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
time = { version = "0.3", features = ["macros", "formatting", "parsing", "serde", "std"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "fs"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.5", features = ["timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi", "json"] }
html-escape = "0.2"
async-trait = "0.1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
# gzip handles upstream Simple-index/JSON responses; wheels are already
# compressed, so brotli/zstd buy nothing but two C/Rust codec dependency trees.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "gzip", "stream"] }
pep440_rs = "0.7.3"
toml = "1.1.2"
# Already in the tree via reqwest; used directly to classify a URL host as an
# IP literal vs a name in the SSRF guard.
url = "2"
object_store = { version = "0.14.1", features = ["aws", "gcp", "azure"] }
pulldown-cmark = { version = "0.13.4", default-features = false }

# mimalloc on every arch except s390x/ppc64le: their manylinux2014 cross-GCC is too
# old to accept the `-Wno-error=date-time` flag libmimalloc-sys passes, so the C
# build fails there. Those two are niche (the system allocator is fine); the common
# cloud arches (x86_64/aarch64) keep the win. main.rs gates the allocator to match.
[dev-dependencies]
# The stateright model checker exhaustively verifies
# the event protocol and the multi-bucket merge over all bounded interleavings
# (tests/model_*.rs). Dev-only: never linked into the shipped binary.
stateright = "0.31"
# The deterministic simulator (examples/vopr.rs) runs the fleet on a paused
# virtual-time runtime; `start_paused` lives behind tokio's test-util feature.
# Feature unification scopes this to test/example builds only.
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(not(any(target_arch = "s390x", target_arch = "powerpc64")))'.dependencies]
mimalloc = "0.1.52"

# Policy as data: these apply to local `cargo clippy` and rust-analyzer, not just
# the CI `-D warnings` gate. Kept deliberately small — no clippy::pedantic.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
exit = "warn"

# Applied uniformly to every release build — wheel, Docker, and `cargo install`.
# thin LTO + a single codegen unit buy most of fat-LTO's runtime/size win at a
# fraction of the compile cost; strip here makes the [tool.maturin] strip flag
# redundant and also shrinks the (previously unstripped) Docker/CI binaries.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1
