# Free multi-scanner security suite — the coverage a corporate AppSec stack
# (Snyk, Black Duck, Sonar, GitGuardian, Checkmarx, …) buys, assembled from tools
# that cost nothing to run here:
#
#   SCA      cargo-deny, pip-audit, OSV-Scanner, Trivy
#   SAST     CodeQL (rust + python + actions), Semgrep community
#   Secrets  gitleaks, TruffleHog (verified only), Trivy secret mode
#   Supply   zizmor (Actions), actionlint
#   Optional Snyk Open Source + Snyk Code (only when SNYK_TOKEN is a repo secret)
#
# One deliberate absence: cargo-deny does not check advisories. cargo-audit is
# already a per-PR merge gate in ci.yml (`make audit`, which is a bare
# `cargo audit` — no ignore list, nothing acknowledged, everything fails), so
# deny.toml is licenses/bans/sources policy only and this workflow runs
# `cargo deny check licenses bans sources`. One tool per question; two tools
# reading the same advisory DB is two places to argue with about the same CVE.
#
# The repo is public, so Code Scanning is on and every scanner uploads SARIF to
# the Security tab. The `!github.event.repository.private` gates stay anyway:
# Code Scanning — every SARIF upload, plus CodeQL itself — is an Advanced
# Security feature a private repo does not get for free, so each scanner carries
# a plain-text/table twin that takes over automatically if this repo is ever
# made private again. Same pattern ci.yml and docker.yml use for build-provenance
# attestation. Either half gates identically; only where the findings land
# differs.
#
# gitleaks note: the MIT-licensed binary is free for everyone, but the official
# gitleaks-action hard-fails on organization-owned repos without a paid
# GITLEAKS_LICENSE — so the job below downloads and runs the binary directly.
# Every job in this file hard-fails on a finding. Nothing is advisory: Snyk
# skips green while no SNYK_TOKEN secret exists, but the moment one is set it
# gates like the rest, on tool errors as well as findings.
name: Security

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    # Weekly Monday 09:17 UTC. The repo spaces its crons on purpose: fuzz 03:00
    # daily, simulation 03:30 daily, weekly 06:00 Monday. This lands clear of all
    # three so a slow scan never contends with them for runner minutes.
    - cron: '17 9 * * 1'
  workflow_dispatch:

# Keyed on the event too: a master push and the weekly scheduled run share a
# ref, so without this a routine push would cancel the scheduled full scan.
concurrency:
  group: security-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  # ─── Secrets ───────────────────────────────────────────────────────────
  gitleaks:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # The scan walks every commit, not just the tip.
          fetch-depth: 0
          persist-credentials: false
      # The binary is MIT and unlicensed-free; gitleaks-action is not (it
      # demands a paid GITLEAKS_LICENSE on org repos). Pin the release and
      # verify its digest — this runs with the repo checked out.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # Rules and allowlist come from the repo's .gitleaks.toml. `git` is the
      # current spelling; `detect` still works but is hidden and deprecated in 8.x.
      - name: Scan full history
        shell: bash
        run: |
          set -euo pipefail
          gitleaks git . --redact -v

  trufflehog:
    name: secrets (trufflehog)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          # The action defaults `version:` to `latest`, which means the engine
          # this job runs changes under it with no commit here. Pin it: a scanner
          # that rewrites itself between runs cannot be bisected when it reds,
          # and `latest` is a moving download on a job that walks the full git
          # history. Bump deliberately. No `v` — the action interpolates this
          # straight into `ghcr.io/trufflesecurity/trufflehog:<version>`, and
          # those image tags are bare semver even though the git tags are not.
          version: 3.97.1
          # `--results=verified` is the current spelling; `--only-verified` is
          # deprecated and will be dropped.
          #
          # lob is excluded because its detector regex matches long snake_case
          # identifiers — this repo's pytest names are full of them — and Lob's
          # API "verifies" the garbage. pypiron will never hold a Lob (postal
          # mail API) key.
          extra_args: --results=verified --exclude-detectors=lob

  # ─── SCA: known CVEs and license/source hygiene in dependencies ────────
  cargo-deny:
    name: sca (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          # advisories omitted on purpose — ci.yml's `make audit` (cargo-audit)
          # is the advisory gate, and it ignores nothing.
          command: check
          arguments: --all-features
          command-arguments: licenses bans sources

  pip-audit:
    name: sca (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: 0.12.6
          enable-cache: false
      # The Python side of this repo is the blackbox test suite and dev/scripts —
      # nothing ships to users — but a compromised test dependency runs with the
      # same rights as everything else in CI. Audit the resolved env rather than
      # a requirements file: pip-audit's venv resolver fights uv-managed Pythons
      # that ship without ensurepip. `uv sync` is what ci.yml runs, so this
      # audits exactly the closure the suite installs.
      - name: Sync env + audit installed packages
        run: |
          uv sync
          uv run --with pip-audit==2.10.1 pip-audit --local --progress-spinner off

  osv:
    name: sca (osv-scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Scan lockfiles
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          # Cargo.lock, fuzz/Cargo.lock, and uv.lock. v2 dropped --skip-git and
          # already excludes .git by default.
          scan-args: |-
            --recursive
            ./
      # osv-scanner-action fails the step on vulns; surfacing them is enough

  trivy:
    name: sca+secrets+misconfig (trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      # Two spellings of one scan. While the repo is private there is nowhere to
      # upload SARIF, so the table variant gates with the findings printed in the
      # job log. The SARIF variant takes over automatically once the repo is
      # public. Either way `exit-code: 1` is what fails the job.
      - name: Trivy filesystem scan (table)
        if: ${{ github.event.repository.private }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          # vuln + secret + misconfig covers SCA, secrets, and the Dockerfile
          scanners: vuln,secret,misconfig
          format: table
          exit-code: '1'
          skip-dirs: target,.git,.local,fuzz/corpus,fuzz/seeds,fuzz/artifacts
      # One scan, not two: trivy writes the SARIF and then applies exit-code, so
      # a single invocation both fails the job and leaves a report to upload.
      - name: Trivy filesystem scan (SARIF)
        if: ${{ !github.event.repository.private }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy.sarif
          exit-code: '1'
          skip-dirs: target,.git,.local,fuzz/corpus,fuzz/seeds,fuzz/artifacts
      # always(): the scan above fails the job on findings, and those are
      # exactly the runs whose SARIF Code Scanning needs.
      #
      # The head-repo test skips the upload on pull requests from forks. A fork
      # PR's token is read-only no matter what `permissions:` asks for, so
      # `security-events: write` is not granted and the upload 403s — turning a
      # clean scan into a red job for a contributor who did nothing wrong. The
      # scan itself still runs and still gates via `exit-code: 1`.
      - name: Upload Trivy SARIF
        if: ${{ always() && !github.event.repository.private && hashFiles('trivy.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          sarif_file: trivy.sarif
          category: trivy

  # ─── SAST ──────────────────────────────────────────────────────────────
  codeql:
    name: sast (codeql ${{ matrix.language }})
    # CodeQL is free on public repos and an Advanced Security feature on private
    # ones. The whole job — not just its upload — waits for the repo to go public.
    #
    # CodeQL has no non-SARIF variant: `analyze` IS the upload, so the fork-PR
    # guard goes on the job rather than on a step. A fork PR's token is read-only
    # and cannot write security events, so without this the job would build the
    # database for up to 45 minutes and then 403 at the last step.
    if: ${{ !github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # actions catches workflow injection patterns; python covers the
        # blackbox suite and dev/scripts.
        language: [rust, python, actions]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          languages: ${{ matrix.language }}
          # security-extended catches more of what commercial SAST reports
          queries: security-extended
      - name: Autobuild
        uses: github/codeql-action/autobuild@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
      - name: Analyze
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          category: '/language:${{ matrix.language }}'

  semgrep:
    name: sast (semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep:1.172.0@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      # --config auto resolves against Semgrep's registry at run time, so this
      # job is deliberately not hermetic: it previews what a corporate scanner
      # running today's rules would flag. A new upstream rule turning this red
      # on an unchanged tree is signal to triage, not flake to retry away.
      # --error is what fails the job in both variants.
      - name: Semgrep community rules (text)
        if: ${{ github.event.repository.private }}
        run: |
          semgrep scan \
            --config auto \
            --error \
            --exclude='target/**' \
            --exclude='.local/**' \
            --exclude='fuzz/corpus/**' \
            --exclude='fuzz/seeds/**' \
            --exclude='fuzz/artifacts/**' \
            .
      - name: Semgrep community rules (SARIF)
        if: ${{ !github.event.repository.private }}
        run: |
          semgrep scan \
            --config auto \
            --sarif \
            --output semgrep.sarif \
            --error \
            --exclude='target/**' \
            --exclude='.local/**' \
            --exclude='fuzz/corpus/**' \
            --exclude='fuzz/seeds/**' \
            --exclude='fuzz/artifacts/**' \
            .
      # Fork PRs skip the upload — read-only token, see the Trivy note above.
      - name: Upload Semgrep SARIF
        if: ${{ always() && !github.event.repository.private && hashFiles('semgrep.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ─── Supply chain / Actions hygiene ────────────────────────────────────
  zizmor:
    name: actions (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: 0.12.6
          enable-cache: false
      # A real gate: zizmor exits non-zero on findings, so no second pass is
      # needed. Deliberate exceptions live in .github/zizmor.yml. Scan all of
      # .github/ rather than just workflows/ so dependabot.yml is covered too.
      # No SARIF here — the findings are in the job log and the step summary,
      # which gates identically and costs nothing to read.
      - name: Audit workflows
        shell: bash
        # GH_TOKEN is what makes this a real audit. Without it zizmor runs
        # offline and silently skips every check that needs the GitHub API —
        # impostor-commit, known-vulnerable-actions, ref-version-mismatch — which
        # are the pin-integrity checks this job exists for. Read-only repo scope
        # is all it uses.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Fenced: the summary is a Markdown document, and zizmor's plain output
          # is column-aligned text that renders as one run-on paragraph without a
          # code fence.
          {
            echo '### zizmor'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # `|| status=$?` rather than a bare pipeline: findings exit non-zero,
          # and under `set -e` that would abort before the closing fence is
          # written, leaving the summary an unterminated code block.
          status=0
          uvx zizmor==1.29.0 --format plain .github/ \
            | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  actionlint:
    name: actions (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      # Same shape as the gitleaks job above, and for a sharper reason: the
      # rhysd/actionlint action has no action.yml at any tagged ref, so `uses:`
      # falls through to its Dockerfile — which builds actionlint from source in
      # a `golang:latest` container on every single run. That is ~3 minutes and a
      # floating base image to run a 2 MB static binary. Pin the release tarball
      # and check its digest instead.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSfL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Lint workflows
        shell: bash
        run: |
          set -euo pipefail
          actionlint -color

  # ─── Optional commercial (free tier) ───────────────────────────────────
  snyk:
    name: sca+sast (snyk)
    # No SNYK_TOKEN secret exists on this repo yet, so today this job schedules,
    # prints one line, and goes green. A job-level `if` cannot read secrets
    # (GitHub context rule), so the gate is a step-level `env.SNYK_TOKEN != ''`
    # on every step that would need the token — an unset token skips them all
    # rather than failing them. Fork PRs get the same treatment for free: secrets
    # are not exposed to them, so the job self-skips instead of erroring.
    #
    # Add the secret and it becomes a hard gate like every other job here: snyk
    # exits 1 on findings and 2/3 on tool errors, and all of those fail the job.
    # No continue-on-error anywhere — that is what turns a scanner that is
    # silently erroring out into a green check.
    #
    # Snyk Code needs to be switched on in the Snyk org settings. If it is not,
    # the SAST step exits 2 with SNYK-CODE-0005 ("Snyk Code is not enabled for
    # the current Organization") and this job goes red — a real prerequisite to
    # restore, not flake to retry away.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Skip when unconfigured
        if: env.SNYK_TOKEN == ''
        run: echo "SNYK_TOKEN not set — skipping (add the repo secret to enable free-tier Snyk)"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        if: env.SNYK_TOKEN != ''
        with:
          persist-credentials: false
      # Upstream's README still says @master everywhere and its tags lag, but
      # v1.0.0 is a real tag and the only commits master has on top of it touch
      # .circleci/config.yml and CODEOWNERS. Pin the tag: it resolves, so zizmor
      # can verify it.
      - uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        if: env.SNYK_TOKEN != ''
        with:
          # `latest` (the default) is a different binary downloaded into CI
          # every run with no commit here. Findings still move on their own —
          # the vulnerability DB is server-side — but the CLI that runs with
          # this job's rights should change only when this line does. Leading
          # `v` required: the action builds the download URL from it verbatim.
          snyk-version: v1.1307.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        if: env.SNYK_TOKEN != ''
        with:
          version: 0.12.6
          enable-cache: false
      # snyk parses neither Cargo.lock nor uv.lock, so `--all-projects` finds
      # nothing here and the CLI dies with SNYK-CLI-0008 (exit 3). Hand it the
      # locked Python closure in a format it does read. The Rust closure is
      # already covered by cargo-audit (ci.yml), cargo-deny, osv-scanner and
      # trivy; what snyk adds is its proprietary DB, which occasionally flags
      # what OSV misses. `--frozen` is load-bearing — an unfrozen export
      # re-resolves and would scan something other than what the suite installs.
      #
      # Two non-obvious requirements, both properties of snyk's own resolver
      # (snyk-python-plugin/pysrc/pip_resolve.py):
      #
      #   pip must be installed in the target interpreter. uv venvs are pip-less
      #   by design, but the plugin's bundled pkg_resources does `from
      #   pip._internal.utils._jaraco_text import ...` on Python >= 3.12. Without
      #   it the resolver dies on import and snyk surfaces only SNYK-CLI-0000
      #   "Failed to test pip project". `uv venv --seed` supplies pip from uv's
      #   own vendored wheel with no index resolution at all. setuptools is not
      #   seeded on 3.12+, so it is pinned here rather than left to float.
      #
      #   the manifest must be marker-free. The plugin honors sys_platform
      #   markers but not python_version ones, and this project's
      #   requires-python is >=3.8, so the universal `uv export` carries two pins
      #   for 18 packages (cffi, pytest, requests, …) — the plugin would demand
      #   every py<3.9 backport be installed and fail with "Required packages
      #   missing". Installing the export (uv evaluates the markers) and then
      #   freezing yields one pin per package: exactly the closure the runner's
      #   interpreter resolves. --skip-unresolved is deliberately NOT used — it
      #   drops unresolved lines silently, so a scan that resolved nothing would
      #   still report green.
      #
      # The venv lives in RUNNER_TEMP rather than the workspace because `snyk
      # code test` below scans the working tree: a venv of third-party sources
      # sitting in it would be analyzed as if it were this repo's code.
      - name: Build the Python closure for snyk to inspect
        if: env.SNYK_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          uv export --frozen --no-hashes --no-emit-project \
            --format requirements-txt -o requirements-snyk-export.txt
          uv venv --seed "$RUNNER_TEMP/snyk-venv"
          uv pip install --python "$RUNNER_TEMP/snyk-venv/bin/python" \
            setuptools==84.0.0 -r requirements-snyk-export.txt
          uv pip freeze --python "$RUNNER_TEMP/snyk-venv/bin/python" \
            > requirements-snyk.txt
      # One invocation, two audiences: --sarif-file-output writes the report to a
      # file while the human-readable form still goes to stdout. That is why
      # these two steps need no table/SARIF twin the way trivy and semgrep do —
      # while the repo is private and there is nowhere to upload SARIF, the
      # findings are already in the job log and the exit code already gates.
      - name: Snyk Open Source (Python closure)
        if: env.SNYK_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          snyk test --file=requirements-snyk.txt --package-manager=pip \
            --command="$RUNNER_TEMP/snyk-venv/bin/python" \
            --severity-threshold=medium --sarif-file-output=snyk-oss.sarif
      # always(): the OSS scan above fails the job on findings, and a red there
      # must not silently skip the SAST scan — both report every run. Snyk Code
      # has no Rust analyzer, so this covers the blackbox suite, dev/scripts and
      # examples/; CodeQL and semgrep are what read the crate.
      - name: Snyk Code (SAST)
        if: always() && env.SNYK_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          snyk code test --severity-threshold=medium --sarif-file-output=snyk-code.sarif
      # Uploads gate exactly like trivy's and semgrep's: Code Scanning needs the
      # repo public, and fork PRs carry a read-only token that cannot write
      # security events. The scans above still gate in both cases.
      - name: Upload Snyk OSS SARIF
        if: ${{ always() && env.SNYK_TOKEN != '' && !github.event.repository.private && hashFiles('snyk-oss.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          sarif_file: snyk-oss.sarif
          category: snyk-oss
      - name: Upload Snyk Code SARIF
        if: ${{ always() && env.SNYK_TOKEN != '' && !github.event.repository.private && hashFiles('snyk-code.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code
