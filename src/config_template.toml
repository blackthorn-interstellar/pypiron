# pypiron.toml — server and mirror configuration.
#
# Generated by `pypiron config init`. Every line below is commented out and
# shows its default, so an untouched file changes nothing: pypiron already runs
# with sensible defaults. Uncomment a line to override it. pypiron auto-loads
# ./pypiron.toml; elsewhere, point at it with --config PATH.
#
# Precedence: CLI flags / env vars  >  this file  >  built-in defaults.
# Every key also has a --flag and a PYPIRON_* env var. Full reference:
# https://pypiron.com/reference/configuration/
#
# Secrets are never read from this file, so it is safe to commit: the admin,
# uploader, and read passwords, the token signing key, and the Azure access key
# come only from the CLI or the environment.

# Reserve a private namespace: names equal to `<prefix>` or starting `<prefix>-`
# are yours alone and never fall through to an upstream (a dependency-confusion
# guard). Shared by `sync` and the `serve` proxy.
# private-prefix = "acme"


[serve]  # the server process — `pypiron serve`

# Address to listen on.
# bind-addr = "0.0.0.0:8080"

# Storage — where artifacts live. Truth is files; there is no database.
# Storage. disk is the zero-dependency default; point `buckets` at object
# storage instead. Disk keys:
# data-dir = "~/.pypiron/packages"          # disk: root folder
# storage-prefix = "pypi"                   # share a bucket: keys become pypi/packages/...

# Object storage: a list of bucket URIs, any mix of backends. Scheme is
# required — s3://, gs://, az://. @region labels a bucket's region (steers
# in-region reads; on S3 it also signs requests). One entry is single-bucket
# mode; several enable replication and failover, the first entry preferred.
# Credentials come from each backend's native chain (AWS chain, ADC, Azure
# env); the endpoint/account knobs below apply per backend. Buckets must exist.
# buckets = ["s3://my-bucket"]

# S3-compatible endpoints (MinIO et al.); apply to every s3:// bucket.
# s3-endpoint-url = "http://localhost:9000"   # point at an S3-compatible endpoint
# s3-force-path-style = false

# Google Cloud Storage. A service-account key enables presigned redirects;
# under Application Default Credentials (no key) downloads stream instead.
# gcs-service-account-path = "/path/to/key.json"
# gcs-endpoint-url = "http://localhost:4443"    # point at a local emulator

# Azure Blob Storage. The account access key (--azure-access-key / AZURE_*)
# stays in the CLI/env and is what enables presigned (SAS) redirects.
# azure-account = "myaccount"
# azure-endpoint-url = "http://127.0.0.1:10000/devstoreaccount1"
# azure-use-emulator = false

# Per-bucket overrides (advanced) — for the rare fleet where buckets need
# different endpoints or credentials. One TOML table per bucket, keyed by its
# URI (matched by scheme://name; any @region is ignored). Fields are
# scheme-specific: endpoint-url (any), force-path-style (s3), env-prefix
# (s3/azure), service-account-path (gcs), account (azure). Secrets never live
# here — env-prefix names the env vars that hold them.
#   [serve.bucket."s3://minio-cache"]
#   endpoint-url = "http://minio.internal:9000"
#   force-path-style = true
#   env-prefix = "MINIO_CACHE_"   # reads MINIO_CACHE_AWS_ACCESS_KEY_ID / ..._AWS_SECRET_ACCESS_KEY

# Proxy — serve unknown (non-private) packages on demand from this upstream,
# verifying and caching each artifact on first request. Scope what it will serve
# with the [mirror] table below.
# proxy-upstream = "https://pypi.org"
# Allow a plaintext http:// upstream. Off by default: over http a MITM controls
# both the bytes and the sha256 they're checked against, defeating verification.
# allow-insecure-upstream = false
# Start sending a large uncached file to the client while it is still downloading
# from upstream. The last bytes wait for the hash check, so a download that
# finishes is a verified one. "off" waits for every file.
# proxy-stream-threshold = "16MiB"

# Supply-chain security — malware blocking plus the org audit, from one OSV feed
# (the same database uv audit uses). On by default: protection nobody configured
# is the point. The feed is a URL or a local path; the startup log names it.
# advisory-feed = "https://osv-vulnerabilities.storage.googleapis.com/PyPI/all.zip"   # "" disables the feature
# malware-block = true                      # refuse to serve/cache files in the feed's malware block set
# malware-probe-secs = 120                  # block new OSV malware within minutes, ahead of the daily feed; 0 disables

# Attach per-client project labels to /metrics (pypiron_project_requests_total).
# Off by default: /metrics is unauthenticated and the label is the basic-auth
# username subaddress, so enabling it lets any scraper enumerate project names.
# metrics-project-labels = false

# How artifact bytes reach clients: auto | redirect | stream. auto redirects
# cache-immune clients (uv) to presigned URLs and streams the rest; redirect
# always 302s so this node never touches bytes; stream always proxies them.
# artifact-delivery = "auto"

# Publishing / CI. Wait for an upload to appear in the index before returning
# 200, so a publish-then-install pipeline is deterministic.
# wait-on-upload = false
# wait-on-upload-secs = 10
# Reject uploads whose version string isn't valid PEP 440 (the default). Keys on
# the version, not the file type: a legacy version is refused; an .egg/.exe/.msi
# with a valid PEP 440 version is still accepted. Direct uploads only — mirror
# uploads bypass it, so sync's own allow-legacy-versions governs mirrored files.
# Set true to accept legacy versions as before.
# allow-legacy-versions = false
# Upload spool directory. Point at real disk where /tmp is a RAM-backed tmpfs,
# or multi-GB wheels spool into memory.
# spool-dir = "/var/spool/pypiron"
# Cap on how many uploads may buffer their whole body in RAM at once. On an
# object-store backend a file up to 64 MiB is read fully into memory for one
# conditional PUT, so unbounded concurrency can OOM a small node; 4 bounds the
# worst case to ~256 MiB. Disk hardlinks the spool and is never gated. 0 = off.
# max-concurrent-artifact-writes = 4

# Logging. By default only mutations (uploads, deletes, yanks) are logged; turn
# this on to log every request — the full access log.
# access-log = false
# access-log-format = "structured"          # structured | clf

# Failed-login cooldown: five failed logins from one address, each within this
# window of the last, lock that address out of logging in for the window.
# login-cooldown-secs = 300                 # 0 disables

# Download statistics (beta) — count per-package/version downloads per day.
# About $0.04 per node per month, no database.
# download-stats = true
# counters-resolution = "1d"                # bucket width: 1d | 1h | 30m | 2h
# counters-flush-interval-secs = 300        # how often each node flushes (the main cost knob)
# counters-rollup-interval-secs = 3600      # how often finished days are compacted
# counters-retention-days = 90

# Worker and multi-node tuning — the defaults are right for most deployments.
# worker-interval-secs = 1                  # cadence for noticing peer nodes' writes
# index-cache-ttl-secs = 1                  # staleness bound on page caches; single-node can raise freely
# bucket-leave-failures = 3                 # consecutive timeout/connect/5xx failures before switching
# bucket-return-healthy-secs = 300           # stable recovery required before returning to a preferred bucket
# fanout-grace-secs = 30                     # pre-ack fan-out grace per secondary bucket before a repair note
# intent-grace-secs = 900                   # upload/replication crash grace; range 3..9223372036854775807
# audit-on-boot = true                      # self-heal sweep when a node becomes leader
# reconcile-interval-secs = 86400           # audit sweep interval (an unchanged corpus is ~free)
# transparency = true                       # write tamper-evident checkpoints (pypiron verify-chain)
# repl-sweep-interval-secs = 300             # _repl/ repair-note sweep backstop (also fires on bucket heal)
# lease-ttl-secs = 30                       # leader lease TTL (multi-node S3)


[mirror]  # the slice of PyPI to mirror/proxy — shared by `sync` and the serve proxy

# Names to include. `sync` mirrors exactly these; the proxy serves only these
# (fail-closed) when set. Each entry is a name with optional PEP 440 specifiers.
# include-packages = ["requests>=2.20,<3", "numpy"]
# include-packages-from = "packages.txt"    # one spec per line; resolves next to this file

# Names to subtract from the include set. A bare name drops the whole project;
# a specifier drops only matching versions.
# exclude-packages = ["legacy-insecure", "demo<2"]
# exclude-packages-from = "denied.txt"

# File filters — all optional; unset means "keep everything".
# include-format = ["wheel", "sdist"]       # wheel | sdist | other
# include-python-tag = ["cp311", "cp312"]
# include-abi-tag = ["cp311", "abi3"]
# include-platform-tag = ["manylinux*", "any"]
# exclude-python-tag = ["pp*"]              # e.g. drop PyPy wheels
# exclude-abi-tag = ["pypy*"]
# exclude-platform-tag = ["win*", "macosx_*"]   # drop Windows and macOS wheels
# exclude-python-below = "3.9"              # drop wheels built only for older Pythons
# exclude-dev = false                       # drop .devN releases
# exclude-prereleases = false               # drop alpha/beta/rc/dev releases
# exclude-windows = false                   # drop .exe/.msi and Windows wheels
# exclude-larger = "250MB"                  # drop artifacts larger than this
# include-yanked = false                    # yanked files aren't fetched by default
                                            # (a version yanked after you cached it still installs;
                                            # proxying, an uncached one lists but won't download)

# Dependency cooldown: keep only files first seen upstream before this cutoff,
# so a freshly published (and quickly yanked) release is held back until it's
# had time to be vetted. Defaults to "7" — a sliding 7-day window. Accepts a
# timestamp, a date, a day count, or a duration ("30 days"). Set "" to mirror
# right up to now.
# exclude-newer = "7"
# exclude-older = "2020-01-01"              # keep only files at or after this cutoff


[sync]  # the push-mirror job — `pypiron sync`

# Destination pypiron server (required for sync — here or via --to). The
# [mirror] table above decides WHAT gets mirrored.
# to = "http://localhost:8080"
# from = "https://pypi.org"                 # source PEP 691 index
# source-kind = "simple"                     # simple or pypicloud
# Source credentials — set only when the source index requires auth (migrating
# off a private devpi/Artifactory/Nexus). Prefer PYPIRON_SYNC_SOURCE_PASS.
# source-user = "reader"
# source-pass = "secret"                    # better: set PYPIRON_SYNC_SOURCE_PASS
# For a pypicloud migration, declare private project names. `*` matches within
# the whole normalized name; a bare `*` is refused. CLI equivalents:
# --private-pattern / --private-patterns-from.
# private-patterns = ["acme-*", "internal-tool"]
# private-patterns-from = "private-packages.txt"
# Destination admin credential (mirroring is admin-only). Prefer supplying the
# password via PYPIRON_SYNC_ADMIN_PASS over committing it here.
# admin-user = "admin"
# admin-pass = "secret"                     # better: set PYPIRON_SYNC_ADMIN_PASS
# concurrency = 4                           # parallel transfers within one package
# package-concurrency = 8                   # packages synced in parallel
# Skip upstream files whose version string isn't valid PEP 440 (the default), so
# a single ancient release can't break a mirror run. Decided entirely here: the
# destination doesn't re-check mirror uploads and stores whatever sync sends. Set
# true to mirror legacy versions.
# allow-legacy-versions = false

# Ferry the advisory snapshot (OSV malware/vuln feed) across the air gap to the
# destination's PUT /advisories/feed, etag-conditioned so an unchanged feed
# transfers nothing. Unset (default): relay the source server's snapshot
# (GET <from>/advisories/feed) when --from is set — on by default. A URL or local
# path fetches that feed instead; "" disables the relay.
# advisory-feed = "https://osv-vulnerabilities.storage.googleapis.com/PyPI/all.zip"
