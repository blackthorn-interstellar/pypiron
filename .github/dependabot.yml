# Only the actions pins live here. Both lockfiles belong to the nightly deps
# lane (.github/workflows/nightly-deps.yml): `uv lock --upgrade` and
# `cargo update` every night behind a 14-day release-age cooldown (pyproject's
# exclude-newer for uv, dev/scripts/bump_deps.py against crates.io publish
# dates for cargo), landing one self-merging lockfile PR. A "cargo" or "uv"
# ecosystem here would fight it over the same lockfiles. Semver-major crate
# upgrades are deliberate code migrations, done by hand; cargo-audit in CI
# flags any advisory that makes one urgent.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # A freshly published release is where a supply-chain compromise is caught,
    # so wait a month before proposing it. One grouped PR a month, not a stream.
    # The cooldown binds version updates only: Dependabot security updates
    # (enabled in repo settings) open a fix PR as soon as an advisory names a
    # pinned action — GHSA-5xjx-3w67-w9x9 sat out this window until zizmor
    # turned master red. They can also land on a lockfile ahead of the nightly
    # lane; the lane rebuilds its branch from master each night, so it absorbs them.
    cooldown:
      default-days: 30
    groups:
      all-actions:
        patterns:
          - "*"
