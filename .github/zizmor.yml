# Findings we accept deliberately. Everything else fails the zizmor job in
# .github/workflows/security.yaml, so keep this list short and justified.
#
# These are scoped to whole files rather than pinned to a line, which is the
# looser of the two options zizmor offers. A `file.yml:NNN` pin is worth it when
# it fails closed — when a NEW step doing the same dangerous thing should still
# turn the gate red. None of the entries below is that shape: each is a
# property of the file as a whole, and ci.yml and docker.yml are the two
# workflows here that change most, so a line pin would drift off its target
# within weeks. zizmor does not warn that an ignore went stale; a pin that stops
# matching just lets the original finding back in unannounced.
rules:
  cache-poisoning:
    # ci.yml and docker.yml both trigger on `push: tags: ['v*']`, and that is
    # what makes zizmor treat every caching step in them as a cache restored
    # during a publishing run. The finding is about the trigger, not the step:
    # every Swatinem/rust-cache and setup-uv in those files is flagged, and any
    # new one would be too, so a line pin buys nothing.
    #
    # zizmor's own auto-fix is `lookup-only: true` on rust-cache, which hardens
    # nothing and costs plenty: it stops restoring the cache on ordinary PR runs
    # as well, turning warm jobs into full cold builds across the whole matrix.
    # Making the cache trigger-aware — cache on PRs, cold-build on tags — is the
    # real fix and deserves its own change. Deferred, not rejected.
    ignore:
      - ci.yml
      - docker.yml

  template-injection:
    # Every flagged expansion in docker.yml is a value the workflow itself owns:
    # `env.REGISTRY` (the literal `ghcr.io`), `env.IMAGE_NAME` (which is
    # `github.repository`), and docker/metadata-action's own `version` and
    # `digest` outputs. Nothing a pull-request author can write reaches them.
    ignore:
      - docker.yml

  excessive-permissions:
    # docker.yml carries no workflow-level `permissions:` block, so its `setup`
    # job — which does nothing but echo a build matrix — inherits the repository
    # default token instead of no token at all. Correcting that means auditing
    # the grants of a publish workflow whose other two jobs push to GHCR and sign
    # provenance attestations, and getting those wrong breaks releases quietly.
    # It belongs in its own reviewed change. Deferred, not rejected.
    ignore:
      - docker.yml

  # ─── Both entries below exist only because the zizmor job runs ONLINE ───
  # The job passes GH_TOKEN, so zizmor resolves every pin against the GitHub API
  # — which is the whole point (impostor-commit and known-vulnerable-actions are
  # unreachable offline). The cost is that two of this repo's pins are inherently
  # unresolvable, and always will be.
  ref-version-mismatch:
    # `dtolnay/rust-toolchain` and `Swatinem/rust-cache` are pinned by SHA with a
    # comment naming a MOVING ref — `# stable` / `# nightly` for the toolchain
    # (upstream's channel branches) and `# v2` for the cache (a major-version
    # tag). zizmor resolves the comment, finds it now points at a newer commit
    # than the pin, and reports a mismatch. That is the pin working as designed:
    # the SHA is what we run, the comment says which channel it was taken from.
    # The gap widens every time upstream moves, so this can never be resolved by
    # re-pinning — only by dropping the comments, which loses the provenance a
    # reviewer needs to bump them. 34 findings across the five files below.
    ignore:
      - ci.yml
      - docker.yml
      - fuzz.yml
      - simulation.yml
      - weekly.yml

  impostor-commit:
    # Same two actions, same cause. zizmor calls a commit an impostor when it
    # cannot find the pinned SHA in any branch or tag of the repo it claims to
    # come from. Both of these publish from channel/major refs that are force-
    # pushed or re-pointed, so a SHA taken from `stable` or `v2` stops being
    # reachable from any named ref the moment upstream moves — the commit is
    # still genuine and still in the repo, just orphaned from every ref zizmor
    # enumerates. Verified by hand: the 17 flagged uses are three distinct SHAs
    # (rust-toolchain stable + nightly, rust-cache v2) and `gh api
    # repos/<owner>/<repo>/commits/<sha>` resolves all three in the repo they
    # name. Re-verify that way on any bump; zizmor cannot do it for these two.
    ignore:
      - ci.yml
      - docker.yml
      - fuzz.yml
      - simulation.yml
      - weekly.yml
