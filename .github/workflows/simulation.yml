name: Simulation

# Deterministic simulation testing plus the deep
# stateright model configurations. The merge gate runs a small VOPR
# smoke and the bounded model checks inside `cargo test`; this nightly job is
# where the real interleaving volume happens — simulated time costs nothing,
# so thousands of seeded fault schedules run per night. Every failure names
# the 8-byte seed that reproduces it exactly.
on:
  schedule:
    - cron: '30 3 * * *' # nightly, 03:30 UTC (fuzz runs at 03:00)
  workflow_dispatch:
    inputs:
      seeds:
        description: 'Seeds per profile'
        default: '50000'

env:
  CARGO_TERM_COLOR: always
  SEEDS: ${{ github.event.inputs.seeds || '50000' }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vopr:
    name: vopr (${{ matrix.profile.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile:
          # Fault profiles inject storage failures; the audit is a documented
          # safety net there, and its repair count is published below. The
          # crash-only profiles permit ZERO audit repairs: markers alone must
          # converge every crash schedule.
          #
          # `--packages 6 --files 2` is a durability floor, not a taste: the
          # three oracles that check acked bytes survive (DURABILITY,
          # VISIBILITY, CONSERVATION) skip any filename an authorized delete,
          # tombstone or conflict freeze removed, so their whole universe is
          # `packages x files` names. At 160 ops with a 10% delete weight the
          # harness default of 2x2 is fully tombstoned by quiesce on four seeds
          # in five — measured per seed, only 20% of this row's seeds evaluated
          # durability AT ALL, while the run still printed a five-figure hit
          # count. 12 names puts it at ~100% (dev/TESTING.md).
          #
          # Every flag a row runs lives in its own `args`. The step below adds
          # only --seeds/--start-seed/--require-reach, which are legal in both
          # modes — because the workload flags and --rotate are mutually
          # exclusive: --rotate derives the whole profile from the seed, so a
          # --ops beside it used to be parsed and silently discarded (the
          # rotating row below carried nodes/buckets/ops for exactly that long,
          # documented as "ignored"). The harness now refuses the pair outright,
          # so a shared template that pastes a topology onto every row cannot
          # start at all.
          - { name: single-bucket, args: '--nodes 2 --buckets 1 --ops 160 --packages 6 --files 2' }
          - { name: multi-bucket, args: '--nodes 3 --buckets 2 --ops 160 --packages 6 --files 2' }
          - { name: single-bucket-crash-only, args: '--nodes 3 --buckets 1 --ops 160 --packages 6 --files 2 --fail-percent 0' }
          - { name: multi-bucket-crash-only, args: '--nodes 3 --buckets 2 --ops 160 --packages 6 --files 2 --fail-percent 0' }
          # The four above pin a topology AND the fixed workload (6 packages x 2
          # files, one hardcoded op mix), so between them they re-explore one
          # shape however many seeds they burn. This one rotates everything the
          # seed can vary — topology, entity counts, and the op-class weights
          # (swarm testing) — which is what found the class-2 global-index
          # divergence at seed 1067836. A failure reproduces with
          # `--seed N --rotate`.
          - { name: rotating-swarm, args: '--rotate' }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # Seeds rotate nightly (day number scales the start), so every night
      # explores fresh schedules while any night's failure still reproduces
      # from its printed seed.
      # `--require-reach` fails the run when any oracle recorded ZERO
      # executions over the sample, or executed on under 25% of its seeds: an
      # oracle that verified nothing is a defect report, not a pass, and a run
      # total hides that as well as a zero does — these rows once reported five
      # figures while 4 seeds in 5 evaluated an empty ledger. It lives here and
      # not on the PR smoke because it only means something at volume — 50,000
      # seeds per profile. Known-zero oracles are excused by name in
      # `EXPECTED_ZERO` (dev/TESTING.md).
      - name: Run seeded simulation
        run: |
          START=$(( ( $(date +%s) / 86400 ) * ${SEEDS} ))
          cargo run --release --example vopr -- \
            --seeds "${SEEDS}" --start-seed "${START}" \
            ${{ matrix.profile.args }} \
            --require-reach | tee vopr.out
      - name: Publish counters
        if: always()
        run: |
          echo '### VOPR — ${{ matrix.profile.name }}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # 22 lines of reach table + the summary above it.
          tail -30 vopr.out >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # NON-BLOCKING, AND KNOWN RED. Do not read a green check here as a pass, and
  # do not remove `continue-on-error` to "fix" it — this lane exists so the
  # coverage is visible and the open bugs have a home, not as a gate.
  #
  # `--partition N` is the share of SEEDS whose fleet is partitioned: on those,
  # each node homes to its own bucket and authors truth there instead of every
  # writer pinning bucket 0. It is what finally makes `replicate::decide`'s merge
  # algebra execute at all: at `--partition 0` every merge verdict beyond the
  # trivial ones reads `[never presented]` over thousands of seeds, and no
  # `.frozen`/`_quarantine/`/`.mirror-quarantined` object is ever created. So
  # everything the aligned matrix above proves, it proves about a fleet whose
  # buckets never disagree.
  #
  # RATE, measured 2026-07-26 at HEAD 238a437 over 404,247 fresh seeds across
  # four profiles (this one, `--rotate`, a crash-only variant, a 3-bucket one):
  # 3 failing seeds = 0.00074% per seed, down 215x from 781 in 488,363 (0.160%)
  # before `4bb9cb8` and `439b839` landed. Compare ranges, not time budgets —
  # the seed rate swings with machine load, so two `--max-secs` runs explore
  # different ranges.
  #
  # THAT IS STILL NOT GATEABLE, and the arithmetic is the whole argument. A draw
  # of N seeds reds with probability 1-(1-p)^N; at p=7.42e-6 a 50,000-seed draw
  # reds 31.0%, and THIS job's actual draw — 90,000-100,000 seeds, from the
  # 91,560 a 900-second run explored on a CI runner — reds 49-52%. A gate that
  # reds one night in two is a gate nobody reads. Holding the nightly to one red
  # night in twenty needs p <= 5.7e-7, one failure per 1.75M seeds: 13x better
  # than measured.
  #
  # Do NOT try to reach green by lowering `--partition`. `partition_for` draws
  # `rng.chance(percent)` once per SEED, so N is a share of seeds, not of writes:
  # halving it halves the partitioned seeds and the failure count together,
  # buying a quieter lane by testing proportionally less.
  #
  # Gateability is not the binding constraint anyway — two of the three
  # survivors are live correctness defects, so gating would only make the
  # nightly permanently red. Every repro below was re-verified red at 238a437.
  #
  # Open root causes:
  #
  #   1. DURABILITY — the demotion settle drops the canonical body AFTER the
  #      fence that exempts it was cleared. End state: the key empty on every
  #      bucket with no `.mirror-quarantined`, no `.frozen`, no tombstone and no
  #      authorized delete, but both bodies still under `_quarantine/` — so
  #      CONSERVATION passes and only DURABILITY reds, because its exemption WAS
  #      the fence. Two paths clear the fence off a record snapshot read before
  #      the settle's drop: `clear_spent_demotion_fence` (src/replicate.rs) and
  #      `supersede_record`'s trailing `delete_keys([mirror_quarantined_key])`.
  #      This violates the adjudication `49801fb` landed — a settled demotion
  #      leaves the SAME one-line fence on both buckets. Not minimizable below
  #      the census profile; 1.0M narrow-profile seeds never produced it.
  #        --seed 16200065974 --nodes 3 --buckets 2 --packages 6 --files 2 --ops 160 --fail-percent 3 --partition 100
  #        --seed 16200021087  (same flags)
  #
  #   2. CONSERVATION — a merge resolution destroys an acked byte-set instead of
  #      moving it. Both fences promise totality (the loser is moved, never
  #      destroyed); this is that promise broken in three arms. Demotion arm: a
  #      settle takes its `_quarantine/` copy, a peer's publish stores its body,
  #      and the settle's UNCONDITIONAL canonical `delete` destroys it. Freeze
  #      arm: now minimized to two nodes and one filename. Bare arm: no fence of
  #      any kind — both buckets hold a live body and sidecar, `_quarantine/`
  #      holds one loser, and a third acked byte-set is simply gone.
  #        --seed 18200013677 --nodes 2 --buckets 2 --packages 1 --files 1 --ops 40 --fail-percent 3 --partition 100   # freeze arm, minimized
  #        --seed 18800106222 --nodes 3 --buckets 2 --packages 2 --files 1 --ops 80 --fail-percent 3 --partition 100   # bare arm, no fence
  #        --seed 16200059870 --nodes 3 --buckets 2 --packages 6 --files 2 --ops 160 --fail-percent 3 --partition 100  # demotion arm
  #
  #   3. SELF_CONSISTENCY — CLOSED. `supersede_record` was not crash-atomic and
  #      a crash inside it left a CROSSED BODY: a bucket serving bytes that
  #      contradict its own published sha256, permanently, because nothing ever
  #      re-hashes a stored body and the two buckets' sidecars stayed identical
  #      so `decide` read the record as agreed forever. The ordering it was
  #      blamed on is correct and stays — a sidecar published over a still-old
  #      body advertises the SUPERSEDED bytes as current, which on a demotion
  #      are exactly the ones the operator withdrew. What was missing is that
  #      the window left nothing behind that said so. It now writes a
  #      `.superseding` fence carrying the sidecar it is installing before it
  #      touches the body and deletes it once the sidecar names those bytes, so
  #      a crash leaves a RECOGNIZABLE torn record; the next index rebuild
  #      re-hashes that one body and finishes the operation. Gated in ci.yml at
  #      the minimum reproducer below.
  #        --seed 18300018803 --nodes 3 --buckets 2 --packages 1 --files 1 --ops 40 --fail-percent 3 --partition 100
  #
  # This lane's profile is the wrong instrument for 2. It and the (now closed) 3
  # were found on NARROW lanes (1-2 packages, 1 file, 40-80 ops), where they run
  # about 1 seed in 200,000-340,000, while the 12-filename corpus here spreads
  # the workload too thin to concentrate contention on a single name. That
  # corpus is load-bearing for the durability oracles (see
  # `tests/simulation_matrix.rs`), so when adding coverage for 2, add a narrow
  # lane — do not widen this one.
  #
  # CLOSED since the previous census, over those 404,247 seeds: CONVERGENCE
  # 750 -> 0, ACK_TOTALITY 17 -> 0, FREEZE_UNJUSTIFIED 14 -> 0, and DURABILITY's
  # old "missing on bucket N" bulk 121 -> 2 (both now root cause 1 above). The
  # coverage behind that is intact rather than suppressed: all 11 `decide`
  # verdicts execute, `.frozen` stands at quiescence on 30.0% of seeds and
  # `_quarantine/` on 35.9%, and the same profile at `--partition 0` zeroes seven
  # verdicts and all three evidence objects.
  #
  # When the failing-seed count reaches zero, delete `continue-on-error` and
  # fold this into the matrix above as an ordinary row.
  vopr-partitioned:
    name: vopr (partitioned authorship — NON-BLOCKING, known red)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # The `multi-bucket` row above plus one flag, so the two are directly
      # comparable — same topology, same 12-filename durability corpus, same op
      # mix; the only difference is who authored the writes.
      #
      # `--max-secs` instead of `--seeds`, because this lane's output is a RATE,
      # not a verdict: without it the run stops at its first failing seed (~300
      # seeds in) and reports nothing you can watch trend. It also bounds the
      # wall clock by construction — 15 minutes of simulation regardless of how
      # slow the runner is, well inside the 60-minute job timeout. `--seeds` is
      # deliberately absent: `--max-secs` supersedes it, and a flag that is
      # parsed and discarded is the defect the matrix above is shaped to avoid.
      # The start seed strides 1,000,000/night — far more than the lane can
      # explore in 15 minutes — so no two nights share a schedule, and the
      # 4e9 offset keeps it clear of the aligned rows' ranges.
      - name: Run partitioned simulation
        run: |
          START=$(( 4000000000 + ( $(date +%s) / 86400 ) * 1000000 ))
          cargo run --release --example vopr -- \
            --start-seed "$START" --max-secs 900 \
            --nodes 3 --buckets 2 --ops 160 --packages 6 --files 2 \
            --partition 100 \
            --require-reach | tee vopr.out
      - name: Publish counters
        if: always()
        run: |
          echo '### VOPR — partitioned authorship (NON-BLOCKING, known red)' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Watch the failing-seed count trend to zero; the open root causes and their' >> "$GITHUB_STEP_SUMMARY"
          echo 'minimized repros are in the job comment in `.github/workflows/simulation.yml`.' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # The summary line spells out every failing seed, which runs to
          # hundreds — keep the counts, drop the two rosters. A green run has no
          # brackets to strip.
          grep -a '^vopr: [0-9]* seeds explored' vopr.out \
            | sed -E 's/ \[[0-9, ]*\]//g' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          grep -a '^reproduce:' vopr.out | head -3 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  model-deep:
    name: stateright (deep configurations)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Exhaustively check the deep model configurations
        run: |
          cargo test --release --test model_replication --test model_event_protocol \
            -- --ignored --nocapture 2>&1 | tee model.out
      - name: Publish state counts
        if: always()
        run: |
          echo '### Stateright — deep configurations' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "unique states|test result" model.out >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
