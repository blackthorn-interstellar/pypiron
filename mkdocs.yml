site_name: pypiron
site_description: An ultra-fast Python package server, written in Rust.
site_author: Blackthorn Interstellar
site_url: https://pypiron.com/
copyright: Copyright &copy; 2025 Blackthorn Interstellar

# Build output lands under .local/ with the rest of the regenerable local state.
site_dir: .local/site

repo_url: https://github.com/blackthorn-interstellar/pypiron
repo_name: blackthorn-interstellar/pypiron
edit_uri: edit/master/docs/

theme:
  name: material
  # Dot-prefixed so mkdocs skips it when walking docs_dir (it's a template
  # directory, not a page).
  custom_dir: docs/.overrides
  logo: assets/pypiron-logo-256.png
  favicon: assets/pypiron-logo-256.png
  features:
    - navigation.sections
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    # Built-in default (light) / slate (dark) schemes, recolored to the iron &
    # rust palette in stylesheets/pypiron.css. Building on slate means we inherit
    # its complete, dark-correct variable set (shadows, code highlighting,
    # admonition/table colors) instead of re-deriving it by hand.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/pypiron.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.magiclink
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  # Emit /llms.txt (an index) and /llms-full.txt (every page inlined) for coding
  # agents that fetch them when pointed at docs. Sections mirror the nav.
  - llmstxt:
      full_output: llms-full.txt
      sections:
        Start here:
          - index.md
          - guides/setup.md
          - guides/migrate.md
        Compare:
          - compare/index.md
          - compare/pypiron-vs-devpi.md
          - compare/pypiron-vs-pypiserver.md
          - compare/pypiron-vs-artifactory.md
        How it works:
          - concepts/how-it-works.md
          - concepts/supply-chain.md
          - concepts/transparency.md
          - concepts/security-model.md
          - concepts/testing.md
          - guides/multi-region.md
          - concepts/download-stats.md
          - for-agents.md
        Reference:
          - reference/configuration.md
          - reference/benchmarks.md
          - privacy.md

nav:
  - Home: index.md
  - Setup: guides/setup.md
  - Migrate off another index: guides/migrate.md
  - Compare:
      - compare/index.md
      - pypiron vs devpi: compare/pypiron-vs-devpi.md
      - pypiron vs pypiserver: compare/pypiron-vs-pypiserver.md
      - pypiron vs Artifactory: compare/pypiron-vs-artifactory.md
  - How it works: concepts/how-it-works.md
  - Supply-chain defense: concepts/supply-chain.md
  - Tamper-evident checkpoints: concepts/transparency.md
  - Security model: concepts/security-model.md
  - How it's tested: concepts/testing.md
  - Multi-region resilience: guides/multi-region.md
  - For AI agents: for-agents.md
  - Download statistics: concepts/download-stats.md
  - Configuration: reference/configuration.md
  - Benchmarks: reference/benchmarks.md
  - Privacy: privacy.md
