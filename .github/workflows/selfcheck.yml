name: Selfcheck

# Preflight for pypiron's automation: proves in about a minute, for $0, that the
# preconditions the scheduled and post-merge jobs quietly depend on still hold on
# a bare runner. Those jobs all gate themselves on a secret or variable and go
# green while testing nothing when it is missing or stale — exactly the failure
# this repo refuses to tolerate elsewhere ("verify the alarm can fire").
#
# Each probe does one of three things: proves the thing works, reports it as not
# configured, or fails because it IS configured and broken. Run it after rotating
# a credential, repointing a bucket, or refreshing the corpus release asset.
#
# Dispatch it from master; on any other ref the job skips outright, because it
# mounts every persistent credential this repo owns (see the gate on the job).
# That was always the rule anyway: the AWS OIDC probe assumes a role whose trust
# policy matches this repo's OIDC subject, and a subject scoped to
# `ref:refs/heads/master` — the normal way to write one — refuses every other
# ref, so a branch run failed on the ref rather than on the credential, which is
# a false alarm about the one thing this workflow exists to rule out.
#
# What it covers:
#   soak-bundle.yml  vars.SOAK_AWS_ROLE / SOAK_S3_BUCKET (AWS OIDC upload)
#   weekly.yml       real-S3 leg secrets/vars; the pinned corpus release asset
#   ci.yml           real-GCS leg secrets
#   nightly-deps.yml secrets.XAI_API_KEY; that Actions is allowed to open PRs
on:
  workflow_dispatch:

permissions: {}

jobs:
  selfcheck:
    name: automation preconditions
    # The security half of the header's "dispatch it from master" rule. This job
    # mounts every persistent credential the repo owns at once — the static AWS
    # key pair, the GCS service-account key, XAI_API_KEY — and workflow_dispatch
    # is satisfied at ANY ref, so without this `gh workflow run selfcheck.yml
    # --ref <branch>` would run that branch's version of THIS FILE with all three
    # in the environment. Nothing has to be smuggled in through a dependency
    # here: editing a probe step to print a secret is a one-line commit on a
    # branch nobody has to approve. Pinning the `environment:` below to master
    # does the same job, but that is repo config no reader of this file can
    # verify; with this line the pinning is belt-and-braces rather than the only
    # defense. Same class as ci.yml's real-GCS job (9445aea) and weekly.yml's
    # real-S3 job (0b69727).
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # AWS/GCP OIDC probes
      contents: write # gh release view, gh api; the canary branch below
      pull-requests: write # the canary pull request below
    # XAI_API_KEY belongs to nightly-deps.yml's repair agent and lives in this
    # environment, so mounting it here also proves the environment itself
    # resolves. Pinning the environment's deployment branches to master is worth
    # doing as a second layer, but the ref gate above is what actually enforces
    # the header's "dispatch from master" rule.
    environment: nightly-deps
    # Nothing here reads the repo, so there is no checkout and no token in
    # .git/config — the canary below builds its branch through the API rather
    # than by cloning and pushing. Secrets appear as booleans so no probe can
    # print one; the steps that need a real value take it as step-scoped env.
    env:
      HAS_SOAK_AWS_ROLE: ${{ vars.SOAK_AWS_ROLE != '' }}
      HAS_SOAK_S3_BUCKET: ${{ vars.SOAK_S3_BUCKET != '' }}
      HAS_SOAK_BUNDLE_KEY: ${{ vars.SOAK_BUNDLE_KEY != '' }}
      HAS_SOAK_AWS_REGION: ${{ vars.SOAK_AWS_REGION != '' }}
      HAS_S3_REAL_BUCKET: ${{ secrets.PYPIRON_TEST_S3_REAL_BUCKET != '' }}
      HAS_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
      HAS_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY != '' }}
      HAS_S3_REGION: ${{ vars.PYPIRON_TEST_S3_REGION != '' }}
      # All four halves of weekly.yml's real-S3 leg, so the static-key probe can
      # actually run.
      S3_STATIC_PROBE: ${{ secrets.PYPIRON_TEST_S3_REAL_BUCKET != '' && secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' && vars.PYPIRON_TEST_S3_REGION != '' }}
      HAS_GCS_REAL_BUCKET: ${{ secrets.PYPIRON_TEST_GCS_REAL_BUCKET != '' }}
      HAS_GCS_SERVICE_ACCOUNT: ${{ secrets.PYPIRON_TEST_GCS_SERVICE_ACCOUNT != '' }}
      # Both halves present, so the GCS probe can actually run.
      GCS_PROBE: ${{ secrets.PYPIRON_TEST_GCS_REAL_BUCKET != '' && secrets.PYPIRON_TEST_GCS_SERVICE_ACCOUNT != '' }}
      HAS_XAI_API_KEY: ${{ secrets.XAI_API_KEY != '' }}
    steps:
      # A gate that is half-configured is the dangerous state: the job runs and
      # fails, or worse reports green having skipped. Presence only — no values.
      - name: Gate inventory (set / not set)
        run: |
          row() {
            if [ "$2" = "true" ]; then s='set'; else s='**not set**'; fi
            printf '| %s | %s | %s |\n' "$1" "$s" "$3" >> "$GITHUB_STEP_SUMMARY"
          }
          {
            echo '### Automation gates'
            echo
            echo '| name | state | gates |'
            echo '| --- | --- | --- |'
          } >> "$GITHUB_STEP_SUMMARY"
          row vars.SOAK_AWS_ROLE               "$HAS_SOAK_AWS_ROLE"         'soak-bundle upload'
          row vars.SOAK_S3_BUCKET              "$HAS_SOAK_S3_BUCKET"        'soak-bundle (on/off)'
          row vars.SOAK_BUNDLE_KEY             "$HAS_SOAK_BUNDLE_KEY"       'soak-bundle (optional)'
          row vars.SOAK_AWS_REGION             "$HAS_SOAK_AWS_REGION"       'soak-bundle (optional)'
          row secrets.PYPIRON_TEST_S3_REAL_BUCKET     "$HAS_S3_REAL_BUCKET"        'weekly real-S3 (on/off)'
          row secrets.AWS_ACCESS_KEY_ID               "$HAS_AWS_ACCESS_KEY_ID"     'weekly real-S3'
          row secrets.AWS_SECRET_ACCESS_KEY           "$HAS_AWS_SECRET_ACCESS_KEY" 'weekly real-S3'
          row vars.PYPIRON_TEST_S3_REGION             "$HAS_S3_REGION"             'weekly real-S3'
          row secrets.PYPIRON_TEST_GCS_REAL_BUCKET    "$HAS_GCS_REAL_BUCKET"       'ci real-GCS (on/off)'
          row secrets.PYPIRON_TEST_GCS_SERVICE_ACCOUNT "$HAS_GCS_SERVICE_ACCOUNT"  'ci real-GCS'
          row secrets.XAI_API_KEY                     "$HAS_XAI_API_KEY"           'nightly-deps repair agent (optional)'
          fail=0
          if [ "$HAS_SOAK_S3_BUCKET" = "true" ] && [ "$HAS_SOAK_AWS_ROLE" != "true" ]; then
            echo "::error::SOAK_S3_BUCKET is set but SOAK_AWS_ROLE is not — soak-bundle.yml will run and fail at the upload step"
            fail=1
          fi
          if [ "$HAS_S3_REAL_BUCKET" = "true" ] && { [ "$HAS_AWS_ACCESS_KEY_ID" != "true" ] || [ "$HAS_AWS_SECRET_ACCESS_KEY" != "true" ] || [ "$HAS_S3_REGION" != "true" ]; }; then
            echo "::error::PYPIRON_TEST_S3_REAL_BUCKET is set but AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / PYPIRON_TEST_S3_REGION are not all set — weekly's real-S3 leg will run and fail"
            fail=1
          fi
          if [ "$HAS_GCS_REAL_BUCKET" = "true" ] && [ "$HAS_GCS_SERVICE_ACCOUNT" != "true" ]; then
            echo "::error::PYPIRON_TEST_GCS_REAL_BUCKET is set but PYPIRON_TEST_GCS_SERVICE_ACCOUNT is not — ci's real-GCS leg will run and fail"
            fail=1
          fi
          exit "$fail"

      - name: AWS OIDC — assume the soak role
        if: env.HAS_SOAK_AWS_ROLE == 'true'
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.SOAK_AWS_ROLE }}
          aws-region: ${{ vars.SOAK_AWS_REGION || 'us-east-1' }}

      - name: AWS OIDC — caller identity
        if: env.HAS_SOAK_AWS_ROLE == 'true'
        run: |
          # The ARN itself is not printed: it carries the AWS account id and this
          # repo is public, so the step summary is world-readable. Whether the
          # call succeeds is the whole signal.
          if ! aws sts get-caller-identity > /dev/null; then
            echo "::error::Assumed-role credentials do not work — soak-bundle.yml cannot upload. Check the role's trust policy allows this repo's OIDC subject, and that this run was dispatched from master."
            exit 1
          fi
          echo "soak role assumed: ok" >> "$GITHUB_STEP_SUMMARY"

      # soak-bundle only needs s3:PutObject on one key, so a least-privilege role
      # may legitimately be unable to list. A denial here is a warning, not a
      # failure: the capability that gates the upload is the role assumption above.
      - name: AWS OIDC — soak bucket reachable
        if: env.HAS_SOAK_AWS_ROLE == 'true' && env.HAS_SOAK_S3_BUCKET == 'true'
        env:
          BUCKET: ${{ vars.SOAK_S3_BUCKET }}
        run: |
          if aws s3 ls "s3://$BUCKET/" > /dev/null; then
            echo "soak bucket listable" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Cannot list s3://$BUCKET/ with the soak role. Expected if the role is scoped to s3:PutObject on the bundle key only; otherwise the bucket name or the role policy is wrong."
          fi

      - name: AWS — not configured
        if: env.HAS_SOAK_AWS_ROLE != 'true'
        run: echo "vars.SOAK_AWS_ROLE is unset — AWS OIDC not configured, nothing to prove." >> "$GITHUB_STEP_SUMMARY"

      # The static keys weekly.yml's real-S3 leg runs on. The inventory above
      # only proves they are SET, which a rotated, disabled or expired key still
      # is — so the gate would report green having tested nothing, which is the
      # exact failure this workflow exists to catch. Use them.
      #
      # Authenticating and listing is not enough either: the suite uploads
      # packages, reads them back, and the minio fixture empties the bucket
      # around every test (tests/conftest.py `_s3_empty_bucket`, an
      # `aws s3 rm --recursive`). A list-only IAM user passes an
      # authenticate-and-list probe and then fails weekly.yml at the first
      # upload, so exercise the whole set — ListBucket, PutObject, GetObject,
      # DeleteObject — on one throwaway key under `selfcheck/`.
      #
      # The region is checked against the bucket's own, not just used: the aws
      # CLI silently follows S3's region redirect, so a wrong
      # PYPIRON_TEST_S3_REGION would pass every call in this step while
      # pypiron's object_store, which does not redirect, fails all weekly long.
      #
      # AWS_SESSION_TOKEN is explicitly blanked. The OIDC step above calls
      # configure-aws-credentials, which exports its assumed-role session token
      # job-wide through GITHUB_ENV; leave it set and the SDK pairs that token
      # with these static keys and gets an InvalidClientTokenId that says nothing
      # about the keys. botocore treats an empty token as absent, so this is the
      # supported way to say "static keys, no session".
      - name: AWS static keys — real-S3 credentials work
        if: env.S3_STATIC_PROBE == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ''
          AWS_REGION: ${{ vars.PYPIRON_TEST_S3_REGION }}
          AWS_DEFAULT_REGION: ${{ vars.PYPIRON_TEST_S3_REGION }}
          BUCKET: ${{ secrets.PYPIRON_TEST_S3_REAL_BUCKET }}
        run: |
          set -u
          if ! aws sts get-caller-identity > /dev/null; then
            echo "::error::secrets.AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY do not authenticate — weekly.yml's real-S3 leg will fail. The key has been rotated, disabled or deleted."
            exit 1
          fi
          # stdout is captured; the CLI's own error text still reaches the log.
          if ! seen=$(aws s3api head-bucket --bucket "$BUCKET" --query 'BucketRegion' --output text); then
            echo "::error::The real-S3 keys authenticate but cannot reach s3://$BUCKET — weekly.yml's real-S3 leg will fail. Check the bucket name in secrets.PYPIRON_TEST_S3_REAL_BUCKET still exists and that the IAM user is allowed on it."
            exit 1
          fi
          case "$seen" in
            "$AWS_REGION") ;;
            ''|None)
              echo "::warning::This aws CLI did not report the bucket's region, so a wrong vars.PYPIRON_TEST_S3_REGION cannot be ruled out here." ;;
            *)
              echo "::error::vars.PYPIRON_TEST_S3_REGION says '$AWS_REGION' but s3://$BUCKET lives in '$seen' — weekly.yml's real-S3 leg signs for the wrong region and fails. Point the variable at the bucket's region."
              exit 1 ;;
          esac
          if ! aws s3 ls "s3://$BUCKET/" > /dev/null; then
            echo "::error::The real-S3 keys reach their test bucket but cannot list it — weekly.yml's real-S3 leg will fail, because the fixture empties the bucket around every test. Check the IAM user still holds s3:ListBucket on it."
            exit 1
          fi
          key="selfcheck/probe-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          sent="$RUNNER_TEMP/s3-probe.sent"
          back="$RUNNER_TEMP/s3-probe.back"
          printf 'pypiron selfcheck %s\n' "$GITHUB_RUN_ID" > "$sent"
          # However this step ends, the probe key goes away.
          trap 'aws s3api delete-object --bucket "$BUCKET" --key "$key" > /dev/null 2>&1 || true' EXIT
          if ! aws s3api put-object --bucket "$BUCKET" --key "$key" --body "$sent" > /dev/null; then
            echo "::error::The real-S3 keys cannot write to s3://$BUCKET — weekly.yml's real-S3 leg will fail at its first upload. Grant the IAM user s3:PutObject on the bucket."
            exit 1
          fi
          if ! aws s3api get-object --bucket "$BUCKET" --key "$key" "$back" > /dev/null; then
            echo "::error::The real-S3 keys can write to s3://$BUCKET but not read back — weekly.yml's real-S3 leg will fail on its first download. Grant the IAM user s3:GetObject on the bucket."
            exit 1
          fi
          if ! cmp -s "$sent" "$back"; then
            echo "::error::s3://$BUCKET returned different bytes than were written — the bucket is not a plain object store (check for a replication, encryption or object-lambda rule that rewrites objects)."
            exit 1
          fi
          if ! aws s3api delete-object --bucket "$BUCKET" --key "$key" > /dev/null; then
            echo "::error::The real-S3 keys cannot delete from s3://$BUCKET — weekly.yml's real-S3 leg will fail, because the fixture empties the bucket before and after every test. Grant the IAM user s3:DeleteObject on the bucket."
            exit 1
          fi
          echo "real-S3 static keys authenticate; bucket in $AWS_REGION; list/put/get/delete round trip ok" >> "$GITHUB_STEP_SUMMARY"

      - name: AWS static keys — not configured
        if: env.S3_STATIC_PROBE != 'true'
        run: echo "real-S3 secrets/vars not all set — static AWS keys not configured, nothing to prove." >> "$GITHUB_STEP_SUMMARY"

      # setup-gcloud runs before auth so the credential file that auth writes is
      # never in scope for a third-party action. auth keeps it out of the job
      # environment (as ci.yml does); the one step that needs it points gcloud at
      # the file itself.
      - name: GCS — install gcloud
        if: env.GCS_PROBE == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: GCS — authenticate with the real-GCS service account
        id: gcp-auth
        if: env.GCS_PROBE == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.PYPIRON_TEST_GCS_SERVICE_ACCOUNT }}
          export_environment_variables: false

      - name: GCS — list the test bucket
        if: env.GCS_PROBE == 'true'
        env:
          CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: ${{ steps.gcp-auth.outputs.credentials_file_path }}
          BUCKET: ${{ secrets.PYPIRON_TEST_GCS_REAL_BUCKET }}
          CLOUDSDK_CORE_DISABLE_PROMPTS: '1'
        run: |
          if ! gcloud storage ls "gs://$BUCKET" > /dev/null; then
            echo "::error::The real-GCS service account cannot list its own test bucket — ci.yml's real-GCS leg will fail. Check the key has not expired and still holds object admin on the bucket."
            exit 1
          fi
          echo "real-GCS bucket listable" >> "$GITHUB_STEP_SUMMARY"

      - name: GCS — not configured
        if: env.GCS_PROBE != 'true'
        run: echo "PYPIRON_TEST_GCS_REAL_BUCKET / PYPIRON_TEST_GCS_SERVICE_ACCOUNT not both set — real-GCS not configured, nothing to prove." >> "$GITHUB_STEP_SUMMARY"

      # weekly.yml's corpus job downloads this exact asset. The tag is pinned in
      # that workflow by hand, so a deleted release or a renamed asset only shows
      # up an hour into a Monday run. Keep the two in step.
      - name: Corpus release asset exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: corpus-2026-06-12 # keep in sync with weekly.yml's corpus job
          ASSET: pypi-files.tsv.gz
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '.assets[].name' | grep -qxF "$ASSET"; then
            echo "::error::Release $TAG has no asset named $ASSET — weekly.yml's corpus job will fail at the download step. Re-publish it, or update the tag in both weekly.yml and here."
            exit 1
          fi
          echo "corpus asset $TAG/$ASSET present" >> "$GITHUB_STEP_SUMMARY"

      - name: GITHUB_TOKEN can read the repo API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! name=$(gh api "repos/$GITHUB_REPOSITORY" --jq .full_name); then
            echo "::error::GITHUB_TOKEN cannot read the repo API — every gh call in weekly.yml and ci.yml is broken"
            exit 1
          fi
          echo "GITHUB_TOKEN reads $name" >> "$GITHUB_STEP_SUMMARY"

      # nightly-deps.yml's repair agent runs on this key. Set-but-dead is the
      # dangerous state: the lane would open a broken bump's PR, mount a rotated
      # key, and burn its one repair attempt on an auth error. Spend one free
      # API call to rule that out.
      - name: XAI_API_KEY authenticates
        if: env.HAS_XAI_API_KEY == 'true'
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            https://api.x.ai/v1/models \
            -H "Authorization: Bearer $XAI_API_KEY")
          if [ "$code" != "200" ]; then
            echo "::error::XAI_API_KEY is set but api.x.ai rejected it (HTTP $code) — nightly-deps.yml's repair agent will fail on every invocation. Rotate the key at console.x.ai."
            exit 1
          fi
          echo "XAI_API_KEY authenticates against api.x.ai" >> "$GITHUB_STEP_SUMMARY"

      - name: XAI_API_KEY — not configured
        if: env.HAS_XAI_API_KEY != 'true'
        run: |
          echo "XAI_API_KEY is unset — nightly-deps.yml runs without its repair rungs: a broken bump ends red with no PR, a red PR ends labeled needs-human. Nothing to prove." >> "$GITHUB_STEP_SUMMARY"

      # The one capability nightly-deps.yml cannot work around. Opening a pull
      # request with the GITHUB_TOKEN is gated by an org- AND repo-level Actions
      # setting that job `permissions:` cannot override, and the failure only
      # shows up at 08:41 UTC as a lane that bumped, checked, and delivered
      # nothing. Prove it here in seconds, for $0.
      #
      # Built through the API rather than by cloning and pushing: this workflow
      # has no checkout by design, and the setting under test gates `pr create`
      # regardless of how the head branch got there. Both writes use the
      # GITHUB_TOKEN, whose events trigger no workflows, so the canary starts no
      # CI run.
      - name: Actions can open a pull request (canary, closed immediately)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          br="selfcheck/canary-$GITHUB_RUN_ID"
          base=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$br" -f sha="$base" > /dev/null
          # Whatever happens next, the branch goes away.
          trap 'gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$br" > /dev/null 2>&1 || true' EXIT
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/.github/selfcheck-canary" \
            -f message="selfcheck canary [skip ci]" \
            -f branch="$br" \
            -f content="$(date -u | base64 | tr -d '\n')" > /dev/null
          if url=$(gh pr create --base master --head "$br" --draft \
              --title "selfcheck canary (auto-closed)" \
              --body "Proves Actions may open pull requests — the capability nightly-deps.yml needs. Auto-closed."); then
            gh pr close "$br" > /dev/null
            echo "Actions can open pull requests (canary $url, closed)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Actions cannot open pull requests — nightly-deps.yml will bump, check, and deliver nothing. Enable 'Allow GitHub Actions to create and approve pull requests' at BOTH org and repo level (Settings -> Actions -> General -> Workflow permissions)."
            exit 1
          fi
