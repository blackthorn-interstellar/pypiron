name: Weekly

# Slow quality checks that are too heavy for a per-PR merge gate: the full
# multi-client compatibility matrix, the full-PyPI corpus check (hits the public
# ClickHouse metadata mirror), and a Rust unit-test coverage summary. Runs weekly
# and on demand.
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays, 06:00 UTC
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compat:
    name: client compat matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: 0.12.6
      - name: Sync dev dependencies
        run: uv sync
      # Exercises poetry/pdm/flit/hatch/pipenv against a real server (fetched on
      # demand via uvx). Regenerates docs/reference/compatibility.md; the working-
      # tree change is discarded, this only checks the clients still pass.
      - name: Client compatibility matrix
        run: make compat

  corpus:
    name: full-PyPI corpus check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # #[ignore]d test: parses real file metadata for the whole PyPI corpus
      # (17M rows). The ClickHouse playground caps demo queries at 100k result
      # rows, so CI uses a pinned snapshot published as a release asset. To
      # refresh: export per the src/corpus_check.rs module docs, then
      # `gh release create corpus-<date> dev/bench/corpus/pypi-files.tsv.gz` and
      # update the tag here. Long-running; not a merge gate.
      - name: Download corpus snapshot (release asset)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dev/bench/corpus
          gh release download corpus-2026-06-12 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern pypi-files.tsv.gz \
            --output dev/bench/corpus/pypi-files.tsv.gz
          ls -lh dev/bench/corpus/pypi-files.tsv.gz
      - name: Corpus check against full PyPI metadata
        run: cargo test --release corpus_full_pypi -- --ignored --nocapture

  coverage:
    name: coverage (llvm-cov)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2.86.6
        with:
          tool: cargo-llvm-cov@0.9.0
      # `make -s` prints only the summary table (stdout); build noise goes to
      # stderr. Fold it into the run's job summary — no external coverage service.
      - name: Rust unit-test coverage summary
        run: |
          {
            echo '### Rust unit-test coverage'
            echo
            echo '```text'
            make -s coverage
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Real-cloud fidelity legs. The per-PR integration job runs the S3/Azure
  # suites against emulators (MinIO/Azurite) and GCS has no emulator at all
  # (dev/TESTING.md). These jobs close that gap by running the blackbox backend
  # suites against real buckets on a schedule. Each gates itself on a bucket
  # secret and no-ops green when the repo isn't configured, so a fork or an
  # unconfigured repo sees a passing, empty job rather than a failure.
  #
  # Both target a DEDICATED, DISPOSABLE bucket: pypiron writes to the bucket
  # root (no per-run key prefix), so the fixtures empty the whole bucket before
  # and after every test. Never point these at a bucket holding anything else.
  real-s3:
    name: blackbox (real S3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Repo config (Settings → Secrets and variables → Actions):
    #   secret PYPIRON_TEST_S3_REAL_BUCKET — dedicated, disposable bucket (also
    #                                        the on/off switch for this job).
    #   secret AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY — credentials with
    #                                        list/get/put/delete on that bucket.
    #   var    PYPIRON_TEST_S3_REGION       — the bucket's region.
    # Only the bucket name (the gate's on/off switch) is job-wide. The AWS
    # credentials are scoped to the one pytest step that needs them, so no other
    # step — a compromised third-party setup action, say — inherits them.
    env:
      PYPIRON_TEST_S3_REAL_BUCKET: ${{ secrets.PYPIRON_TEST_S3_REAL_BUCKET }}
    steps:
      - name: Gate on configured bucket secret
        id: gate
        run: |
          if [ -n "$PYPIRON_TEST_S3_REAL_BUCKET" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "PYPIRON_TEST_S3_REAL_BUCKET is unset — skipping the real-S3 leg."
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        if: steps.gate.outputs.enabled == 'true'
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        if: steps.gate.outputs.enabled == 'true'
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        if: steps.gate.outputs.enabled == 'true'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        if: steps.gate.outputs.enabled == 'true'
        with:
          version: 0.12.6
      - name: Sync dev dependencies
        if: steps.gate.outputs.enabled == 'true'
        run: uv sync
      # AWS CLI is preinstalled on the runner; the fixture uses it plus the
      # ambient AWS_* credentials to empty the bucket around each test.
      - name: Blackbox S3 suite against real S3
        if: steps.gate.outputs.enabled == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.PYPIRON_TEST_S3_REGION }}
          AWS_DEFAULT_REGION: ${{ vars.PYPIRON_TEST_S3_REGION }}
        run: make test-s3-real
