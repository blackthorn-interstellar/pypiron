name: CI

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      build-wheels:
        description: 'Also dry-run the release build matrix (authorize, wheels, sdist, ARMv6 binary)'
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: clippy (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Clippy (fail on warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2.86.6
        with:
          tool: cargo-audit@0.22.2
      # `make audit` is a bare `cargo audit`: no ignore list, nothing
      # acknowledged. Any advisory against Cargo.lock fails the job, and the fix
      # is to move the dependency. This is the repo's only advisory gate —
      # deny.toml deliberately covers licenses/bans/sources and nothing else.
      - name: Audit dependencies for advisories
        run: make audit

  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Unit tests
        run: cargo test --workspace --all-features --locked
      # A taste of the nightly deterministic simulation
      # as a merge gate: a couple dozen seeded multi-node fault schedules, each
      # exactly reproducible from its printed seed. The volume runs nightly in
      # simulation.yml.
      - name: VOPR smoke
        run: |
          cargo run --example vopr -- --seeds 20 --nodes 2 --buckets 2 --ops 80
          # Crash-only mode: no injected storage failures, so the marker
          # protocol must converge with zero audit repairs — a hard invariant.
          cargo run --example vopr -- --seeds 20 --nodes 3 --buckets 2 --ops 80 --fail-percent 0
          # A taste of the rotating profile too: the two above pin the fixed
          # workload (2 packages x 2 files, one op mix), so they would never see
          # a wide-entity or delete-heavy schedule. Reproduce with
          # `--seed N --rotate`; the volume runs nightly.
          cargo run --example vopr -- --seeds 30 --rotate
          # --- Regression seeds ------------------------------------------------
          # READ THIS BEFORE CHANGING ANY SEED OR PROFILE BELOW. A seed is a
          # RECIPE, not an ordering: it regenerates one schedule from (seed x
          # harness x product code), and several of the fixes below reorder
          # storage ops by design. So a pinned seed generally stops reproducing
          # its own bug the moment the fix lands, then keeps passing while
          # exercising something else. Measured, not feared: `VOPR_TRACE=1` on
          # seed 19026 today shows exactly one conditional write of
          # `simple/index.json`, and its one `cas-outcome` is `won` — the lost
          # CAS it is named for no longer occurs in its schedule at all.
          # They stay because they are deterministic, cost milliseconds, and
          # re-walk real fleet code. But almost none of them is the guard. Every
          # shape below names the durable test that pins it — one that pins the
          # bad STATE or the detector rather than a schedule — and those are what
          # may not be deleted. Changing this list deletes no coverage.
          #
          # A torn record (live body + stale backfilled sidecar) that reconcile
          # refused to heal, and a paused delete whose stale intent a concurrent
          # tick consumed with a pre-mutation rebuild (lost signal, crash-only
          # audit repair). Originally found by these seeds; the shapes are pinned
          # by `replicate::tests::torn_source_record_drops_stale_sidecar_for_rebuild`
          # (the heal), `worker::tests::a_backfill_retracts_the_sidecar_it_fabricated_over_vanished_bytes`
          # (the tear's creation — the fabrication is retracted, so no later
          # upload inherits it) and
          # `conformance_tick::stale_unpaired_intent_heals_the_crashed_writer`
          # (the re-arm before a healed stale intent is consumed).
          cargo run --example vopr -- --seed 1784486481 --nodes 3 --buckets 3 --ops 120 --fail-percent 3
          cargo run --example vopr -- --seed 1784817003 --nodes 2 --buckets 3 --ops 80 --fail-percent 3
          cargo run --example vopr -- --seed 1784521773 --nodes 3 --buckets 1 --ops 80 --fail-percent 0
          # Convergence regressions the audit-repair taxonomy soak surfaced, each
          # a failed storage op once treated as authoritative (the family of
          # commit e860792). 7384/19900: a sidecar read/backfill availability
          # error was laundered into "corrupt/skip", so the rebuild derived an
          # empty view and DELETED a live single-file package, then consumed its
          # own dirty markers (two topologies). 19026: a failed global-index CAS
          # left the name delta absorbed into the cache with the old ETag pinned,
          # so every retry saw changed=false and left a dead package listed.
          # 47843: the empty-view poisoning under two buckets. Originally found
          # by these seeds; the shapes are pinned by
          # `worker::tests::a_transient_sidecar_read_error_fails_the_rebuild_instead_of_burying_the_package`
          # (a live package's view survives a sidecar read blip and its markers
          # are retained) and
          # `worker::tests::a_failed_global_index_write_does_not_leave_the_delta_absorbed_in_the_cache`
          # (the retry of a delta whose write errored is still a change). The
          # rotating soak (nightly simulation.yml) re-explores the wider space
          # (14402, 23921, 41013, ...).
          cargo run --example vopr -- --seed 7384 --nodes 2 --buckets 1 --ops 80 --fail-percent 3
          cargo run --example vopr -- --seed 19900 --nodes 3 --buckets 1 --ops 80 --fail-percent 3
          cargo run --example vopr -- --seed 19026 --nodes 2 --buckets 1 --ops 160 --fail-percent 3
          cargo run --example vopr -- --seed 47843 --nodes 2 --buckets 2 --ops 120 --fail-percent 3
          # Freeze justification, both shapes. Two partitioned nodes commit
          # different bytes under one filename, the merge correctly freezes it,
          # and a delete racing `freeze_side` destroys the bodies before either
          # `_quarantine/` copy is taken — so the freeze is real and every
          # body-shaped trace of it is gone. 9800020745 loses both byte-sets
          # (nothing attested at all); 9800002480 loses one. Both are oracle
          # false-faults, so the durable cover is the oracle's evidence model,
          # not the product: `sim::tests::a_fenced_delete_keeps_the_bodies_it_destroys`
          # (a delete under a fence may not erase the proof that two byte-sets
          # stood under one filename), plus `an_unfenced_delete_ends_the_incarnation`
          # and `a_refused_writers_debris_never_attests` for the other direction —
          # the history may not invent a conflict out of a cache eviction or a
          # refused writer's debris. The detection direction stays honest via the
          # `--break freeze-unjustified` leg below.
          cargo run --example vopr -- --seed 9800020745 --nodes 2 --buckets 2 --packages 1 --files 1 --ops 16 --fail-percent 0 --partition 100
          cargo run --example vopr -- --seed 9800002480 --nodes 2 --buckets 2 --packages 1 --files 1 --ops 16 --fail-percent 0 --partition 100
          # Ack totality. One node publishes a mirror record, a partitioned peer
          # claims the package private, and the bucket that resolved the
          # demotion acks with the other bucket never told: `decide` answered
          # `Noop` — "the two sides agree" — over a pair where one side held a
          # fence and the other held nothing, `execute` mapped that to
          # `Converged`, and the fan-out wrote no `_repl/` note. Minimized from
          # the 200-op census repros (9300024588, 9300035976, 9300061064,
          # 9504440, 14700042703) to two nodes and 40 ops, where ACK_TOTALITY is
          # the ONLY violation — so this reds for its own reason, not as a
          # passenger on a convergence failure. Originally found by these seeds;
          # the shape is pinned by
          # `replicate::tests::fanout_sync_never_acks_a_demotion_the_peer_never_heard_of`,
          # which asserts the oracle's own predicate over that pair.
          cargo run --example vopr -- --seed 9900094440 --nodes 2 --buckets 2 --packages 2 --files 1 --ops 40 --fail-percent 0 --partition 100
          # Crossed body: a supersede died between replacing the artifact and
          # publishing the sidecar naming it, so bucket 0 served one byte-set
          # while its own index advertised the other's sha256. Both violations
          # this seed raised are that one tear — SELF_CONSISTENCY reads it
          # within a bucket, CONVERGENCE reads the same crossed pair across the
          # two. Permanent before the `.superseding` fence, because nothing
          # re-hashes a stored body and the two buckets' sidecars stayed
          # byte-identical, so `decide` called the record agreed forever.
          # Originally found by this seed; the shape is pinned by
          # `replicate::tests::a_rebuild_finishes_a_supersede_that_died_before_publishing_its_sidecar`
          # and `replicate::tests::the_repair_leaves_a_supersede_that_died_before_touching_the_body`
          # (the `.superseding` intent is finished or discarded, never left to
          # rot), and the detector that sees the class by the `--break attest`
          # leg below. What only the seed adds is the placement of the repair: it
          # reds if the fix moves off the rebuild path onto the periodic audit.
          cargo run --example vopr -- --seed 18300018803 --nodes 3 --buckets 2 --packages 1 --files 1 --ops 40 --fail-percent 3 --partition 100
          # Demotion settle vs a racing publish. `.mirror-quarantined` is the
          # one fence that deliberately does NOT bar an upload — handing the
          # filename to private truth IS the demotion's resolution — so the
          # canonical key stays writable while a settle runs. A sibling settle
          # holding a three-ops-stale read then deleted the body a private
          # publish had just created and would ack, and no `_quarantine/` copy
          # anywhere held those bytes. The settle now drops only the body it
          # personally preserved. Originally found by this seed; the shape is
          # pinned by
          # `replicate::tests::a_demotion_settle_drops_only_the_body_it_preserved`.
          cargo run --example vopr -- --seed 40000042940 --nodes 2 --buckets 2 --packages 1 --files 1 --ops 40 --fail-percent 3 --partition 100
          # A delete that tombstoned and THEN failed. `delete_record` writes the
          # tombstone before it removes the body, so the 500 from a storage
          # outage on the delete still leaves the filename permanently barred;
          # the fleet propagates that tombstone and `tombstone_side` destroys
          # the body on every peer. The harness read any `Err` as a refusal and
          # withdrew the destruction it had recorded, so CONSERVATION held the
          # freeze racing that delete to a totality the delete had made
          # impossible. The fix was the harness's ledger, so what has to stay
          # true is the PRODUCT fact it now depends on: originally found by this
          # seed, the ordering is pinned by
          # `publish::tests::a_failed_artifact_delete_still_leaves_the_filename_barred`.
          # Reorder the tombstone behind the body and that test reds — which is
          # the signal that the ledger rule has gone wrong too.
          cargo run --example vopr -- --seed 18200013677 --nodes 2 --buckets 2 --packages 1 --files 1 --ops 40 --fail-percent 3 --partition 100
          # The same settle, the OTHER arm. `40000042940` above pinned the case
          # where a racing publish's body was already standing at the settle's
          # re-read; this one is the case where it was not yet — the key read
          # empty, the create landed while the delete was in flight, and the
          # delete was unconditional. A `twine upload` got its 200 and the bytes
          # then existed nowhere: no `_quarantine/` copy, no `.tombstone`, no
          # `.frozen`. A re-read cannot separate the two arms and the fix is what
          # does — the body is deleted only when a verified `_quarantine/` copy
          # of exactly those bytes exists. Originally found by this seed; the
          # shape is pinned by
          # `replicate::tests::a_demotion_settle_never_drops_a_body_it_never_preserved`.
          cargo run --example vopr -- --seed 86001009016 --nodes 3 --buckets 2 --packages 1 --files 1 --ops 26 --fail-percent 1 --partition 100
          # A settle emptying a canonical key out from under a replication copy,
          # between the copy's artifact leg and its sidecar. The leg publishes
          # bytes first exactly so the sidecar after it can only describe bytes
          # the bucket holds — but the settle's delete retracts that ownership,
          # the sidecar lands over an empty key, the next create takes it with
          # different bytes, and bucket 0 serves one byte-set under the other's
          # published sha256 forever. Originally found by this seed (which needed
          # 6 packages to reach it — the victim is the sixth name); the shape is
          # pinned by
          # `replicate::tests::a_copy_never_publishes_truth_over_a_body_the_bucket_lost`.
          cargo run --example vopr -- --seed 62000150551 --nodes 3 --buckets 2 --packages 6 --files 2 --ops 80 --fail-percent 3 --partition 100
          # Two false FREEZE_UNJUSTIFIED reds, both HARNESS defects: the freeze
          # was right and the attestation could not see its evidence.
          # `publish_record` refuses an upload over a `.tombstone`/`.frozen` and
          # deletes what it wrote — but only single-bucket. With peers it leaves
          # the body standing ("occupied and inert"), a replication copy then
          # loses its create to it, reads it back and freezes both sides
          # (`replicate::freeze_copy_race`), and those bytes are the only
          # evidence there is: no sidecar was published, so no ack names them
          # and no `_quarantine/` copy is taken. The harness had written off
          # every fence-refused body as debris, unconditionally. Both
          # `--shrink`-minimized (80 -> 63 ops, 160 -> 94). The durable cover is
          # the evidence model:
          # `sim::tests::a_refused_writers_debris_attests_only_once_something_loses_to_it`
          # asserts all three directions at once — a refused body nobody went
          # for stays out, one a create lost to becomes attestable, and an
          # ordinary 409 against a published record (the legitimate
          # mirror->private succession next door) adds nothing.
          cargo run --example vopr -- --seed 97800043727 --nodes 3 --buckets 3 --packages 6 --files 4 --ops 63 --fail-percent 3 --partition 100
          cargo run --example vopr -- --seed 121000059774 --nodes 3 --buckets 3 --packages 6 --files 2 --ops 94 --fail-percent 3 --partition 100
          # A stranded global-index pair whose JSON was ABSENT, not merely stale.
          # `write_global_indexes_cas` writes `simple/index.html` before the
          # canonical `simple/index.json`, so a crash between the legs strands
          # them, and `load_global_names` is what tells that apart from a cold
          # start. But the no-op gate in `update_global_index_locked` decided
          # whether to reload by comparing ETags, and an absent JSON's ETag is
          # `None` — equal to the `None` a cache pinned at cold start. A peer's
          # tear therefore read as "JSON unchanged" on every later tick: no
          # reload, no `stranded`, no JSON, while the HTML reconcile below still
          # rewrote the live HTML down to that cache's stale empty name set,
          # declared the pair current and consumed the dirty markers — retiring
          # the only signal covering the tear, until the tier-3 audit had to
          # materialize the JSON. That is what AUDIT_PREMATURE_CONSUMPTION reds
          # on. Originally found by this seed; the shape is pinned by
          # `worker::tests::an_absent_json_under_a_published_html_is_not_read_as_a_cold_start`
          # (a cold-pinned cache meets a peer's tear: the JSON is materialized
          # and the live HTML is not wiped down to the cached empty set). Its
          # sibling
          # `worker::tests::a_peers_stranded_global_html_is_seen_by_the_node_that_won_the_last_cas`
          # is the other arm — the HTML's ETag moving with the JSON present —
          # and reaches no absent JSON.
          cargo run --example vopr -- --seed 13792606396100784374 --rotate
          # A publish that could not READ the filename fence freed the key it had
          # just won. `publish_record` wins the artifact key with an immutable
          # create, then HEADs `<file>.tombstone` to see whether the filename is
          # fenced; when that HEAD ERRORED — an outage, not an answer — the
          # single-bucket arm deleted the body it had just created and returned
          # 503. That frees an immutable name under a rebuild that may already
          # have read those bytes and be one op from publishing the §4 backfill
          # sidecar naming them: the fabrication lands over an empty key, the
          # next upload of the same filename wins the create with different
          # bytes, and the bucket serves body B under the published sha256 of
          # body A permanently — nothing re-hashes a stored body, so every
          # sidecar-comparing reader calls the record healthy forever. The fix
          # leaves the body standing on an unreadable fence (inert: a fenced
          # filename is suppressed from every index, a live one is typed by the
          # same backfill); the proven-fenced arm still clears it. Two nodes and
          # one bucket, so no replication leg is involved and SELF_CONSISTENCY is
          # the only oracle that sees it. Originally found by this seed; the
          # shape is pinned by
          # `publish::tests::an_unreadable_filename_fence_leaves_the_created_body_standing`
          # (an errored fence HEAD leaves the created body) and
          # `publish::tests::a_proven_filename_fence_still_frees_the_body_it_created`
          # (the answered arm still clears it, so the fix cannot be over-applied
          # into leaving live bodies under spent filenames).
          # `publish::tests::a_failed_artifact_delete_still_leaves_the_filename_barred`
          # is the delete path next door, not this one.
          cargo run --example vopr -- --seed 2519159830454370605 --rotate
      # Mutation-testing the oracles themselves. Each `--break` is ONE deliberate
      # defect the named invariant exists to catch, so the run MUST fail with
      # that invariant's text — an invariant nobody has watched go red is an
      # assertion of faith, not a test. The seed range is pinned and the
      # simulator is deterministic, so this is a gate, not a sample; 6 seeds is
      # >= every measured K (dev/TESTING.md), so it stays a gate even if a
      # future change shifts which seed a break first bites on.
      - name: Oracle kill proofs (--break)
        run: |
          fail=0
          # K comes from dev/TESTING.md's table, not from a constant here, so the
          # documented number is the seed budget the gate actually draws. An
          # understated K stops being a stale doc row and becomes a red build —
          # which is the only thing that kept the previous hand-maintained column
          # honest for about a week (it shipped `slow-repair | 2` for a break
          # that kills at 1, next to a break that killed nothing at all).
          k_for() {
            local k
            k=$(sed -n "s/^| \`$1\` |.*| *\([0-9][0-9]*\) *|$/\1/p" dev/TESTING.md | head -1)
            if [ -z "$k" ]; then
              echo "::error::--break $1 has no K row in dev/TESTING.md — every leg must be documented" >&2
              echo 6
            else
              echo "$k"
            fi
          }
          check() { # name expected-text flags...
            local name="$1" expect="$2"; shift 2
            local k; k=$(k_for "$name")
            if out=$(cargo run --example vopr -- --seeds "$k" "$@" --break "$name" 2>&1); then
              echo "::error::--break $name passed — the oracle behind '$expect' is dead"
              fail=1
            elif ! grep -qF "$expect" <<<"$out"; then
              echo "::error::--break $name failed for the wrong reason; expected '$expect'"
              tail -30 <<<"$out"
              fail=1
            else
              echo "ok: --break $name red '$expect'"
            fi
          }
          # One leg per oracle. Every invariant the simulator asserts is here,
          # and so is every arm of the audit-repair classifier: an arm with no
          # leg below is an arm nobody has watched fire.
          check view      "VERIFY: bucket 0 diverged"  --nodes 2 --buckets 1 --ops 80
          check fanout    "ACK_TOTALITY:"              --nodes 2 --buckets 2 --ops 80 --fail-percent 0
          check rerun     "op traces matched but the final world differs" \
                                                       --nodes 2 --buckets 2 --ops 80 --recheck-every 1
          check resurrect "TOMBSTONE_MONOTONICITY:"    --nodes 2 --buckets 1 --ops 80
          check durability "DURABILITY: acked"         --nodes 2 --buckets 1 --ops 80
          check visibility "VISIBILITY: acked"         --nodes 2 --buckets 1 --ops 80
          check conserve  "CONSERVATION: acked bytes"  --nodes 2 --buckets 1 --ops 80
          check diverge   "CONVERGENCE: bucket 0"      --nodes 2 --buckets 2 --ops 80
          # STALENESS has two arms and they are two different defects, so each
          # gets its own leg: `wedge` parks debris nothing consumes, so the
          # fleet never settles at all; `slow-repair` steals a peer's copy once
          # the fleet believes it is done, so the fleet converges — correctly,
          # completely, and one whole tree-diff cycle past the deadline its
          # outstanding debt bought it. A budget that counts heal rounds cannot
          # see the second one, which is why it is no longer the budget.
          check wedge     "the fleet never stopped working" --nodes 2 --buckets 1 --ops 80
          check slow-repair "past its" --nodes 2 --buckets 2 --ops 80 --packages 6 --files 2
          # Classifier arms. `ordering`/`globalindex` are the two class-1 inputs
          # (per-package and global membership); the rest each red BOTH analyzers
          # at once, so the expected text names the arm, not the subsystem.
          # class 3 is a statistic under fault injection by design, so its leg is
          # the crash-only profile, where any audit repair is a violation.
          check ordering  "AUDIT_ORDERING: bucket0"    --nodes 2 --buckets 1 --ops 80
          check globalindex "AUDIT_ORDERING: bucket0 simple/index.* membership of" \
                                                       --nodes 2 --buckets 1 --ops 80
          check poison    "a poisoned derivation consumed the signal" --nodes 2 --buckets 1 --ops 80
          check blind     "were all consumed blind"    --nodes 2 --buckets 1 --ops 80
          check race      "unleased concurrent rebuild" --nodes 2 --buckets 1 --ops 80 --fail-percent 0
          # Same plant as `race`, judged at the global index: the staler write
          # DELISTED a name the fresher write listed. The product forbids that
          # direction (the audit re-proves dead observations inside the locked
          # CAS attempt), so it is class 2 — a violation under fault injection,
          # hence no --fail-percent 0 here.
          check stale-delist "stale delist:"           --nodes 2 --buckets 1 --ops 80
          check fallback  "unexplained drift"          --nodes 2 --buckets 1 --ops 80
          # The partition oracles — one leg per invariant BRANCH, not per
          # oracle: freeze justification and freeze totality are two different
          # claims about `.frozen`, and origin exclusivity is asserted once on
          # the package claim and once on the record under it. A branch sharing
          # a leg with its neighbour is a branch nobody has watched fire.
          # `freeze-lossy`/`demote-lossy` also red VERIFY (a fenced record
          # leaves the renderable set while the view still lists it) and `split`
          # also reds CONVERGENCE (a split filename IS a diverged key); the
          # expected text below names the one invariant each leg is for.
          # `demote-lossy` is what keeps DURABILITY's `.mirror-quarantined`
          # exemption honest: a settled demotion empties the canonical key on
          # every bucket, so CONSERVATION is the only oracle left asserting the
          # loser was MOVED to `_quarantine/` rather than destroyed.
          check freeze-unjustified "FREEZE_UNJUSTIFIED:" --nodes 2 --buckets 1 --ops 80
          check freeze-lossy  "a frozen filename may not lose one" --nodes 2 --buckets 1 --ops 80
          check demote-lossy  "a demoted filename may not lose it" --nodes 2 --buckets 1 --ops 80
          # The one continuous oracle: it weighs each body delete AS IT HAPPENS
          # instead of reading the final world. `demote-lossy` is its leg
          # because it is the exact shape a weaker reading would excuse — the
          # `.mirror-quarantined` marker stands, but it is the one fence that
          # does not bar an upload, so it can stand over bytes it never
          # adjudicated and here there is no `_quarantine/` copy of them.
          check demote-lossy  "UNTYPED_DISAPPEARANCE:" --nodes 2 --buckets 1 --ops 80
          check origin-demoted "ORIGIN_TERMINALITY: bucket 0 claims" --nodes 2 --buckets 1 --ops 80
          check mirror-served "ORIGIN_TERMINALITY: bucket 0 still serves" --nodes 2 --buckets 1 --ops 80
          check split     "never left split"           --nodes 2 --buckets 2 --ops 80
          # The only oracle anywhere that re-hashes a body. The break pulls the
          # bytes and the published sha256 apart from the *sidecar* side and
          # re-points the views at the new digest, so every other oracle — and
          # `pypiron verify`, which runs here as the VERIFY leg — reads a
          # perfectly healthy fleet. If this leg ever passes, a bucket can serve
          # bytes contradicting its own index and nothing will say so.
          check attest    "SELF_CONSISTENCY: bucket"   --nodes 2 --buckets 1 --ops 80
          exit $fail

  integration:
    # The product's center of gravity is the blackbox suite (dev/TESTING.md): the
    # real binary driven over HTTP by real uv/pip/twine clients. The disk leg is the
    # fast merge gate and explicitly excludes the s3/azure markers; the cloud legs
    # run their own selection against MinIO/Azurite (Docker is preinstalled on the
    # runner, so the fixtures find it instead of skipping). The multi-client compat
    # matrix (poetry/pdm/flit/hatch via uvx) and the full-PyPI corpus check are too
    # slow for a merge gate and run in the weekly workflow, not here.
    name: blackbox (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: disk
            markers: "not perf and not stress and not compat and not s3 and not azure"
            workers: 8
          - backend: s3
            markers: "s3 and not perf and not stress"
            workers: 4
          - backend: azure
            markers: "azure and not perf and not stress"
            workers: 4
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: 0.12.6
      - name: Sync dev dependencies
        run: uv sync
      # Pre-build so the xdist workers' ensure_built calls are cheap no-ops
      # instead of eight processes contending on cargo's target-dir lock.
      - name: Build server binary
        run: cargo build --locked
      # Worker count is per-leg (matrix.workers). The disk leg runs at -n 8: it
      # carries no fault-injection markers, so its waits are truly wait-bound —
      # containers, HTTP polls — and oversubscribing the 4-vCPU runner keeps it
      # busy. Both cloud legs (s3 and azure) run at -n 4, one worker per vCPU:
      # they carry multi-region fault-injection tests that assert on real timing
      # windows (1s bucket-health probe deadlines, hysteresis/drip windows), and
      # 2x oversubscription starves the CPU enough that a probe to a *healthy*
      # bucket times out — a spurious failover the tests then flag. The azure
      # leg's `azure` marker collects test_multicloud's failover-timing test,
      # which is the same family. Honest scheduling, not oversubscription, is
      # what those windows need. --durations so each leg reports where time goes.
      - name: Blackbox suite (${{ matrix.backend }} mode)
        run: uv run -- pytest tests -m "${{ matrix.markers }}" -n ${{ matrix.workers }} --durations=25

  real-gcs:
    # GCS has no faithful local emulator (dev/TESTING.md), so this real-bucket
    # run is its only end-to-end coverage. It is post-merge, not a merge gate:
    # pull_request runs from a fork get no secrets, so it would report a green
    # check having tested nothing — and a GCS outage should not redden a PR.
    # Each test picks its own --storage-prefix, so runs never collide.
    #
    # Repo config (Settings → Secrets and variables → Actions):
    #   secret PYPIRON_TEST_GCS_REAL_BUCKET     — bucket to test against
    #                                             (also the on/off switch).
    #   secret PYPIRON_TEST_GCS_SERVICE_ACCOUNT — service-account JSON key with
    #                                             object admin on that bucket.
    name: blackbox (real GCS)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYPIRON_TEST_GCS_REAL_BUCKET: ${{ secrets.PYPIRON_TEST_GCS_REAL_BUCKET }}
    steps:
      - name: Gate on configured bucket secret
        id: gate
        run: |
          if [ -n "$PYPIRON_TEST_GCS_REAL_BUCKET" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "PYPIRON_TEST_GCS_REAL_BUCKET is unset — skipping the real-GCS leg."
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        if: steps.gate.outputs.enabled == 'true'
        with:
          persist-credentials: false
      # Writes the SA key to a file and exposes its path as an output. We do NOT
      # export GOOGLE_APPLICATION_CREDENTIALS job-wide (export_environment_variables:
      # false) — that would hand the SA key to every later step, including any
      # third-party setup action. Instead the pytest step alone sets it from this
      # step's credentials_file_path output; the fixture passes it to pypiron as
      # the GCS service-account path (which also enables presigned-URL signing)
      # and gcloud picks it up as ADC for cleanup.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        id: gcp-auth
        if: steps.gate.outputs.enabled == 'true'
        with:
          credentials_json: ${{ secrets.PYPIRON_TEST_GCS_SERVICE_ACCOUNT }}
          export_environment_variables: false
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        if: steps.gate.outputs.enabled == 'true'
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        if: steps.gate.outputs.enabled == 'true'
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        if: steps.gate.outputs.enabled == 'true'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        if: steps.gate.outputs.enabled == 'true'
        with:
          version: 0.12.6
      - name: Sync dev dependencies
        if: steps.gate.outputs.enabled == 'true'
        run: uv sync
      - name: Blackbox GCS round-trip against real GCS
        if: steps.gate.outputs.enabled == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.gcp-auth.outputs.credentials_file_path }}
        run: make test-gcs-real

  python-lint:
    name: python lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: 0.12.6
      - name: Sync dev dependencies
        run: uv sync
      # dev/ops is deployed infrastructure: linted, never formatted. Keep the
      # two path lists in step with the Makefile's PY_LINT / PY_FMT.
      - name: Ruff lint and format check
        run: |
          uv run -- ruff check tests dev/bench dev/scripts dev/ops
          uv run -- ruff format --check tests dev/bench dev/scripts

  fuzz-build:
    name: fuzz build (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2.86.6
        with:
          tool: cargo-fuzz@0.13.2
      # Keep the fuzz targets compiling. Coverage-guided runs stay manual
      # (`make fuzz`); this only guards against bitrot in the harness.
      - name: Compile all fuzz targets
        # Pin the gnu host target: recent cargo-fuzz defaults to musl even on a
        # gnu host, and musl's static libc is incompatible with ASan.
        # https://github.com/rust-fuzz/cargo-fuzz/issues/398
        run: cargo fuzz build --target x86_64-unknown-linux-gnu

  # Branch protection does not cover tags: a pushed vX.Y.Z can point at any
  # commit, and this workflow builds and trusted-publishes from the tagged
  # commit — so a tag at an arbitrary, unreviewed commit would otherwise ship to
  # PyPI and the GitHub Release, bypassing code review. Refuse unless the built
  # commit is reachable from master. Every job on the release path needs this, so
  # an unauthorized tag never even starts the wheel matrix. A workflow_dispatch
  # dry-run runs on a branch ref, publishes nothing (both release jobs are
  # tag-gated) and is exempt — enforcing ancestry there would only wrongly block
  # a legit dry-run from an unmerged branch.
  #
  # The dry-run is opt-in (`build-wheels`), not automatic: a plain dispatch is
  # how the repo's own automation gets the test gates onto a branch GitHub will
  # not fire a `pull_request` for (a GITHUB_TOKEN-authored PR triggers nothing —
  # see nightly-deps.yml), and dragging a 15-cell cross-platform wheel matrix
  # along nightly for a lockfile bump buys nothing.
  authorize:
    name: authorize (tag reachable from master)
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.build-wheels)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # fetch-depth: 0 makes checkout fetch every branch into refs/remotes/origin/*,
      # so origin/master below is this run's truth, not a stale cache. That is the
      # only fetch this job needs or does: persist-credentials is false, so a
      # second `git fetch` here would run unauthenticated and start failing the
      # day the repo is made private.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse a tag not reachable from master
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "authorized: $GITHUB_SHA is reachable from master"
          else
            echo "::error::tag commit $GITHUB_SHA is not on master — refusing to release"
            exit 1
          fi

  # Wheel builds run only for release tags (and a manual dispatch that ticks
  # `build-wheels`, for testing the pipeline). The version is stamped from the
  # tag; the repo itself stays at 0.0.0.
  # One job, one matrix over every (kind, runner, target). maturin-action treats an
  # unset manylinux as auto and ignores it off Linux, and the aarch64-gnu CFLAGS is a
  # no-op elsewhere, so the steps are identical for every platform. fail-fast is off
  # so one platform's failure doesn't cancel the rest (these were independent jobs).
  wheels:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.build-wheels)
    name: wheels (${{ matrix.kind }}, ${{ matrix.target }})
    needs: authorize
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `triple` is the Rust target the wheel embeds; it names the standalone
          # binary archive pulled from that same wheel (see "Archive ..." below).
          # `smoke`/`container_smoke` mark the rows whose wheel this runner can
          # actually EXECUTE (see the smoke steps below); every other row is
          # cross-compiled or libc-mismatched and says so out loud instead.
          - { kind: linux,     runner: ubuntu-22.04,   target: x86_64,  triple: x86_64-unknown-linux-gnu, smoke: true }
          - { kind: linux,     runner: ubuntu-22.04,   target: x86,     triple: i686-unknown-linux-gnu }
          # aarch64/armv7's manylinux2014 cross-GCC can't compile mimalloc's C, so build
          # them with zig (the toolchain the Docker image cross-compiles all 8 with).
          # s390x/ppc64le use an even older cross-GCC that --zig doesn't redirect, so
          # mimalloc is gated off them (Cargo.toml) and they build as before.
          - { kind: linux,     runner: ubuntu-22.04,   target: aarch64, triple: aarch64-unknown-linux-gnu, zig: "--zig" }
          - { kind: linux,     runner: ubuntu-22.04,   target: armv7,   triple: armv7-unknown-linux-gnueabihf, zig: "--zig" }
          - { kind: linux,     runner: ubuntu-22.04,   target: s390x,   triple: s390x-unknown-linux-gnu }
          - { kind: linux,     runner: ubuntu-22.04,   target: ppc64le, triple: powerpc64le-unknown-linux-gnu }
          - { kind: linux,     runner: ubuntu-22.04,   target: riscv64, triple: riscv64gc-unknown-linux-gnu }
          - { kind: musllinux, runner: ubuntu-22.04,   target: x86_64,  triple: x86_64-unknown-linux-musl,  manylinux: musllinux_1_2, container_smoke: true }
          - { kind: musllinux, runner: ubuntu-22.04,   target: x86,     triple: i686-unknown-linux-musl,    manylinux: musllinux_1_2 }
          - { kind: musllinux, runner: ubuntu-22.04,   target: aarch64, triple: aarch64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { kind: musllinux, runner: ubuntu-22.04,   target: armv7,   triple: armv7-unknown-linux-musleabihf, manylinux: musllinux_1_2 }
          # `pyarch` picks the interpreter the smoke step installs the wheel with:
          # pip refuses a win32 wheel on a 64-bit Python, so the x86 row needs a
          # 32-bit one (the 32-bit exe itself runs fine on the x64 runner). The
          # aarch64 wheel can't execute here at all and is build-only.
          - { kind: windows,   runner: windows-latest, target: x64,     triple: x86_64-pc-windows-msvc, smoke: true, pyarch: x64 }
          - { kind: windows,   runner: windows-latest, target: x86,     triple: i686-pc-windows-msvc, smoke: true, pyarch: x86 }
          - { kind: windows,   runner: windows-latest, target: aarch64, triple: aarch64-pc-windows-msvc }
          # GitHub retired the macos-13 (Intel) image on 2025-12-04; macos-15-intel
          # is its standard x86_64 replacement (last Intel image, supported to ~2027-08).
          - { kind: macos,     runner: macos-15-intel, target: x86_64,  triple: x86_64-apple-darwin, smoke: true }
          - { kind: macos,     runner: macos-14,       target: aarch64, triple: aarch64-apple-darwin, smoke: true }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: ./.github/stamp-version.sh "$GITHUB_REF_NAME"
      # A release ships the freshest malware floor it can fetch; on any failure
      # the committed floor (at most one release old) ships instead.
      - name: Refresh embedded malware floor
        shell: bash
        run: python3 dev/scripts/compile_malware_floor.py || echo "::warning::floor refresh failed; shipping the committed floor"
      # Make the README baked into the wheel/sdist metadata render on PyPI:
      # rewrite its repo-relative links/logo to absolute URLs (pinned to the
      # stamped tag). The committed file stays GitHub-relative.
      - name: Rewrite README links to absolute URLs for PyPI
        shell: bash
        run: command -v python3 >/dev/null 2>&1 && python3 dev/scripts/transform_readme.py --target pypi || python dev/scripts/transform_readme.py --target pypi
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          # Unset, the action resolves `maturin>=1.0,<2.0` from pyproject.toml
          # against a manifest it reads off its own `main` branch — so the build
          # backend that produces the published wheels floats on two moving
          # inputs. Pin the release the resolution lands on today.
          maturin-version: v1.15.0
          target: ${{ matrix.target }}
          args: --release --locked ${{ matrix.zig }} --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
        env:
          CFLAGS_aarch64_unknown_linux_gnu: "-D__ARM_ARCH=8"
      # Fingerprint dist/ the moment it is built, and stash the digest OUTSIDE
      # dist/. The smoke steps below run pip and docker with network access; a
      # compromised action or PyPI dependency could rewrite an already-built
      # wheel in that window and still pass its own smoke. The verify step just
      # before upload re-checks these digests, and the `release` job re-checks
      # them again against what it downloads, so a tampered artifact can never
      # reach trusted publishing unnoticed.
      - name: Record dist digests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/digests"
          # shasum fallback: macOS arm64 runners ship no sha256sum (the Intel
          # image only has one incidentally, via coreutils). Same output format.
          if command -v sha256sum >/dev/null; then sha256sum dist/*; else shasum -a 256 dist/*; fi \
            > "$RUNNER_TEMP/digests/${{ matrix.kind }}-${{ matrix.target }}.sha256"
      # Prove the wheel we just built actually installs and RUNS before it can be
      # published: `maturin build` succeeding says nothing about whether the
      # packaged executable starts. Only rows this runner can execute are smoked
      # (matrix.smoke); the cross-compiled and libc-mismatched wheels are skipped
      # with a visible note below rather than silently. Windows needs the
      # arch-matched interpreter (matrix.pyarch) or pip rejects the win32 wheel.
      - name: Set up Python for smoke
        if: matrix.smoke
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          architecture: ${{ matrix.pyarch }}
      - name: Smoke test the built wheel
        if: matrix.smoke
        shell: bash
        run: |
          set -euo pipefail
          # A relative venv dir, not $RUNNER_TEMP: on Windows that is a backslash
          # path and this step runs under git-bash on three OSes.
          rm -rf smoke-venv
          if [[ "$RUNNER_OS" == "Windows" ]]; then bin=smoke-venv/Scripts; ext=.exe; else bin=smoke-venv/bin; ext=; fi
          python -m venv smoke-venv
          "$bin/python$ext" -m pip install --disable-pip-version-check --no-input dist/*.whl
          "$bin/pypiron$ext" --version
          "$bin/pypiron$ext" --help > /dev/null
          # On a tag, the binary must also report the version we stamped — a
          # wheel built before the stamp would still start, and still be wrong.
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            expect="${GITHUB_REF_NAME#v}"
            got=$("$bin/pypiron$ext" --version)
            if [[ "$got" != "pypiron $expect "* ]]; then
              echo "::error::--version reported '$got', expected version $expect"
              exit 1
            fi
          fi
      # musl wheels can't run on the glibc runner, but docker can: run the same
      # smoke inside Alpine. One row — x86_64, the runner's native docker arch —
      # covers the class; the other musl arches would need QEMU and stay
      # build-only. dist is mounted read-only so the container cannot touch it.
      #
      # The image is digest-pinned. It is the only third-party thing this release
      # path pulls by a moving tag, and it runs with dist/ mounted on a job that
      # goes on to publish those exact wheels. Bump the digest and the version
      # comment together.
      - name: Smoke test the musllinux wheel in an Alpine container
        if: matrix.container_smoke
        shell: bash
        env:
          # python 3.12.14-alpine3.24
          ALPINE_PY: python:3.12-alpine@sha256:d09d15e60962ca365d1cd544a48773bac9d33f2fb1b00f2aa0deec78ade7dc31
        run: |
          set -euo pipefail
          expect=""
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then expect="${GITHUB_REF_NAME#v}"; fi
          docker run --rm -e "PYPIRON_EXPECT_VERSION=$expect" -v "$PWD/dist:/dist:ro" "$ALPINE_PY" sh -c '
            set -e
            python3 -m venv /tmp/smoke
            /tmp/smoke/bin/pip install --disable-pip-version-check --no-input /dist/*.whl
            /tmp/smoke/bin/pypiron --version
            /tmp/smoke/bin/pypiron --help > /dev/null
            if [ -n "$PYPIRON_EXPECT_VERSION" ]; then
              /tmp/smoke/bin/pypiron --version | grep -q "^pypiron $PYPIRON_EXPECT_VERSION " || {
                echo "::error::--version did not report $PYPIRON_EXPECT_VERSION"; exit 1; }
            fi
          '
      - name: Note wheel not smoked (cross-compiled / libc-incompatible)
        if: ${{ !matrix.smoke && !matrix.container_smoke }}
        shell: bash
        run: echo "::notice::${{ matrix.kind }}/${{ matrix.target }} wheel cannot execute on this runner (cross-compiled or libc-incompatible) — built, not smoked"
      # Fail loudly if dist/ changed since it was built, before it is uploaded
      # and (on a tag) trusted-published. Re-listing and diffing rather than
      # `sha256sum -c`: -c only re-checks the files it was given, so a wheel
      # ADDED to dist/ after the record step would pass it — and upload-artifact
      # and the PyPI publish take the whole directory. The diff compares the
      # exact same listing, so additions, edits and deletions all fail.
      - name: Verify dist unchanged since build
        shell: bash
        run: |
          set -euo pipefail
          if command -v sha256sum >/dev/null; then sha256sum dist/*; else shasum -a 256 dist/*; fi \
            | diff - "$RUNNER_TEMP/digests/${{ matrix.kind }}-${{ matrix.target }}.sha256"
      - name: Upload wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-${{ matrix.kind }}-${{ matrix.target }}
          path: dist
      # Hand the digests to the `release` job so it can re-verify what it
      # downloads against what was built here, not just against itself.
      - name: Upload dist digests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-digests-${{ matrix.kind }}-${{ matrix.target }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
      # Re-wrap the compiled binary already inside the wheel as a standalone
      # archive — the GitHub-Release download for this target. No second compile.
      - name: Archive standalone binary
        shell: bash
        run: |
          command -v python3 >/dev/null 2>&1 && PY=python3 || PY=python
          "$PY" dev/scripts/archive_binary.py --dist dist --triple "${{ matrix.triple }}" --out binaries
      # Same guard the wheels get, for the same reason. `release-binaries` writes
      # a SHA256SUMS manifest of whatever it downloads, which records bytes
      # rather than verifying them — a manifest of a tampered archive is a
      # perfectly consistent manifest. These are the digests taken here, at build
      # time, and they are what `release-binaries` diffs against before it
      # manifests, attests, or publishes anything.
      - name: Record binary digests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin-digests"
          # shasum fallback: macOS arm64 runners ship no sha256sum. Same format.
          if command -v sha256sum >/dev/null; then sha256sum binaries/*; else shasum -a 256 binaries/*; fi \
            > "$RUNNER_TEMP/bin-digests/${{ matrix.kind }}-${{ matrix.target }}.sha256"
      - name: Upload standalone binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binaries-${{ matrix.kind }}-${{ matrix.target }}
          path: binaries
          if-no-files-found: error
      # `binary-digests-`, not `binaries-digests-`: `release-binaries` collects
      # the archives with `pattern: binaries-*`, and a `binaries-digests-…`
      # artifact would match it and be merged into the directory it is supposed
      # to be checking — and then published to the Release. Same reason the
      # wheels' digests are `dist-digests-`, not `wheels-digests-`.
      - name: Upload binary digests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binary-digests-${{ matrix.kind }}-${{ matrix.target }}
          path: ${{ runner.temp }}/bin-digests/*
          if-no-files-found: error

  sdist:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.build-wheels)
    needs: authorize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: ./.github/stamp-version.sh "$GITHUB_REF_NAME"
      # A release ships the freshest malware floor it can fetch; on any failure
      # the committed floor (at most one release old) ships instead.
      - name: Refresh embedded malware floor
        shell: bash
        run: python3 dev/scripts/compile_malware_floor.py || echo "::warning::floor refresh failed; shipping the committed floor"
      # Make the README baked into the wheel/sdist metadata render on PyPI:
      # rewrite its repo-relative links/logo to absolute URLs (pinned to the
      # stamped tag). The committed file stays GitHub-relative.
      - name: Rewrite README links to absolute URLs for PyPI
        shell: bash
        run: command -v python3 >/dev/null 2>&1 && python3 dev/scripts/transform_readme.py --target pypi || python dev/scripts/transform_readme.py --target pypi
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.15.0 # same pin as the wheels job
          command: sdist
          args: --out dist
      # Same dist-integrity guard as the wheels job: fingerprint the freshly
      # built sdist outside dist/, verify it just before upload, and hand the
      # digest to the `release` job. The sdist is not smoked — installing it
      # compiles the whole crate from source, which this job has no toolchain
      # for and the wheel rows already cover the "does the binary run" question.
      - name: Record dist digests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/digests"
          sha256sum dist/* > "$RUNNER_TEMP/digests/sdist.sha256"
      - name: Verify dist unchanged since build
        shell: bash
        run: |
          set -euo pipefail
          sha256sum dist/* | diff - "$RUNNER_TEMP/digests/sdist.sha256"
      - name: Upload sdist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-sdist
          path: dist
      - name: Upload dist digests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-digests-sdist
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error

  release:
    name: Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [authorize, fmt, clippy, test, wheels, sdist]
    permissions:
      # Used for PyPI trusted publishing and to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      # The sha256 each build job recorded of its own dist/ the moment it was
      # built. One file per matrix row, so merge-multiple can't collide them.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dist-digests-*
          merge-multiple: true
          path: dist-digests
      # Verify → attest → verify, and the repetition is the point. An attestation
      # is a signed statement that GitHub built these exact bytes, so attesting
      # first and checking afterwards would mint a real, publicly verifiable
      # provenance record for tampered artifacts and only THEN fail the job — the
      # signature outlives the red build. Check before signing. Then check again
      # after, because the attestation step itself has network access.
      #
      # Re-hash what we are about to sign and require it to be exactly what the
      # build jobs recorded. This closes the window the build-side verify can't
      # see: artifact transit and the merged download. Diffing full listings
      # rather than `sha256sum -c` so an artifact ADDED to dist/ (which the
      # publish would happily upload) fails too.
      - name: Verify dist unchanged since build (before attesting)
        shell: bash
        run: |
          set -euo pipefail
          cat dist-digests/*.sha256 | sort > "$RUNNER_TEMP/expected.sha256"
          sha256sum dist/* | sort > "$RUNNER_TEMP/actual.sha256"
          diff "$RUNNER_TEMP/expected.sha256" "$RUNNER_TEMP/actual.sha256"
          echo "verified $(wc -l < "$RUNNER_TEMP/actual.sha256") artifacts against their build-time digests"
      # Build-provenance attestation is a public-repo-only feature; skip it while
      # the repo is private (it reactivates automatically once the repo is public).
      - name: Generate artifact attestation
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: 'dist/*'
      # Last gate before trusted publishing: the same check again, now covering
      # the attestation step's own network access.
      - name: Verify dist unchanged since build (before publishing)
        shell: bash
        run: |
          set -euo pipefail
          cat dist-digests/*.sha256 | sort > "$RUNNER_TEMP/expected.sha256"
          sha256sum dist/* | sort > "$RUNNER_TEMP/actual.sha256"
          diff "$RUNNER_TEMP/expected.sha256" "$RUNNER_TEMP/actual.sha256"
          echo "verified $(wc -l < "$RUNNER_TEMP/actual.sha256") artifacts against their build-time digests"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          skip-existing: true

  # ARMv6 (Raspberry Pi 1 / Zero) has no musllinux wheel, so it isn't in the
  # `wheels` matrix and gets no extracted binary. Cross-compile the static musl
  # binary directly (cargo-zigbuild, no QEMU — same path the container build uses)
  # and hand it to `release-binaries` as a `binaries-*` artifact so it lands on
  # the GitHub Release with everything else.
  binary-armv6:
    name: binary (armv6)
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.build-wheels)
    needs: authorize
    runs-on: ubuntu-latest
    env:
      TRIPLE: arm-unknown-linux-musleabihf
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: ./.github/stamp-version.sh "$GITHUB_REF_NAME"
      # A release ships the freshest malware floor it can fetch; on any failure
      # the committed floor (at most one release old) ships instead.
      - name: Refresh embedded malware floor
        shell: bash
        run: python3 dev/scripts/compile_malware_floor.py || echo "::warning::floor refresh failed; shipping the committed floor"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: arm-unknown-linux-musleabihf
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: armv6
      # Kept in step with docker.yml: 0.23.0 filters the
      # `-Wl,--fix-cortex-a53-843419` that Rust 1.98 emits for aarch64-linux and
      # zig rejects (rust-cross/cargo-zigbuild#452).
      - uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2.86.6
        with:
          tool: cargo-zigbuild@0.23.0
      # Pin+hash ziglang so a hijacked or yanked PyPI release can't poison the
      # ARMv6 release binary. 0.16.0 is what the unpinned install already
      # resolved to; the hash is the x86_64-linux host wheel — the only platform
      # this runner fetches. Bump the version and hash together.
      - name: Install zig
        run: |
          echo 'ziglang==0.16.0 --hash=sha256:9fcda73f62b851dd72a54b710ad40a209896db14cfb13649e62191243556342b' > "$RUNNER_TEMP/zig-requirements.txt"
          python3 -m pip install --user --break-system-packages --require-hashes -r "$RUNNER_TEMP/zig-requirements.txt"
      - name: Cross-compile (static musl, ARMv6 hard-float)
        run: cargo zigbuild --release --locked --target "$TRIPLE"
      - name: Archive standalone binary
        run: |
          mkdir -p binaries
          tar -C "target/$TRIPLE/release" -czf "binaries/pypiron-$TRIPLE.tar.gz" pypiron
      # Build-time digest, same as every wheels-matrix row — see the note there.
      - name: Record binary digests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin-digests"
          sha256sum binaries/* > "$RUNNER_TEMP/bin-digests/armv6.sha256"
      - name: Upload standalone binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binaries-armv6
          path: binaries
          if-no-files-found: error
      - name: Upload binary digests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binary-digests-armv6
          path: ${{ runner.temp }}/bin-digests/*
          if-no-files-found: error

  # Standalone binaries → GitHub Release. The per-target binaries were already
  # pulled from the wheels (the `wheels` job), so this just collects them, writes
  # a checksum manifest, attests them, and attaches them to the tag's Release.
  # PyPI wheels stay separate (the `release` job above); the GHCR image is its
  # own workflow (docker.yml).
  release-binaries:
    name: Release binaries (GitHub)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [authorize, fmt, clippy, test, wheels, binary-armv6]
    permissions:
      contents: write       # create the Release and upload assets
      id-token: write       # provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Generate release notes
        run: python3 dev/scripts/release_notes.py --tag "$GITHUB_REF_NAME" --to "$GITHUB_REF_NAME" --output release-notes.md
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: binaries-*
          merge-multiple: true
          path: binaries
      # The sha256 each build job recorded of its own binaries/ the moment the
      # archive was written. One file per row, so merge-multiple can't collide
      # them.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: binary-digests-*
          merge-multiple: true
          path: binary-digests
      # Verify BEFORE the manifest, the attestation and the upload. SHA256SUMS
      # below hashes whatever arrived — it describes these bytes, it does not
      # vouch for them — so without this step nothing between the build job and
      # the Release is checked at all: artifact transit, the merged download, and
      # an added file would all sail through and get a signed provenance
      # attestation on the way out. Diffing full sorted listings rather than
      # `sha256sum -c`, so an archive ADDED to binaries/ (which `gh release
      # upload binaries/*` would happily publish) fails too.
      - name: Verify binaries unchanged since build
        shell: bash
        run: |
          set -euo pipefail
          cat binary-digests/*.sha256 | sort > "$RUNNER_TEMP/expected-bin.sha256"
          sha256sum binaries/* | sort > "$RUNNER_TEMP/actual-bin.sha256"
          diff "$RUNNER_TEMP/expected-bin.sha256" "$RUNNER_TEMP/actual-bin.sha256"
          echo "verified $(wc -l < "$RUNNER_TEMP/actual-bin.sha256") binaries against their build-time digests"
      - name: Generate checksums
        working-directory: binaries
        run: sha256sum pypiron-* > SHA256SUMS
      # Build-provenance attestation is a public-repo-only feature; skip it while
      # the repo is private (it reactivates automatically once the repo is public).
      - name: Generate artifact attestation
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: 'binaries/pypiron-*'
      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber binaries/*
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --notes-file release-notes.md binaries/*
          fi
