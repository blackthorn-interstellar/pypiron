# cargo-deny: license allowlist, dependency bans, and source hygiene.
# Run locally: `cargo deny check licenses bans sources`.
# Docs: https://embarkstudios.github.io/cargo-deny/
#
# Advisories are deliberately NOT checked here. `make audit` (a bare
# `cargo audit`, no ignore list — every advisory fails it) is the advisory gate
# and runs on every PR via ci.yml. This file is licenses/bans/sources policy
# only, and .github/workflows/security.yaml invokes `check licenses bans sources`
# to match. One tool per question: adding an `[advisories]` section here would
# create a second place to argue with about the same CVE, and the copy nobody
# edits is the one that goes stale.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.8
# Permissive-only allowlist. Unused entries stay as future headroom, not noise.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
    "NCSA",
    "BSL-1.0",
]

[licenses.private]
ignore = true

[bans]
# Advisory only, and honestly so: every level here is "warn" and there is no
# `deny` list at all, so this section cannot fail the build today. It exists to
# print the duplicate-version report and to be where a real ban lands when
# there is one. `[licenses]` above and `[sources]` below are the two halves of
# this file that actually gate.
#
# Duplicate versions are a fact of any real dependency tree; surface them
# without failing the build.
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
