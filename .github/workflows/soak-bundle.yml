name: Soak bundle

# Build the aarch64 VOPR binary + ops scripts into the S3 bundle the soak fleet
# runs. On every master push the fleet self-refreshes onto the new bundle within
# ~10 min — this is how a merged fix reaches the running soak. Inert until you
# set the repo variables below, so it never fails on an unconfigured repo:
#   vars.SOAK_S3_BUCKET   - target bucket (e.g. my-bucket)
#   vars.SOAK_BUNDLE_KEY  - key (default soak/bundle.tar.gz)
#   vars.SOAK_AWS_ROLE    - IAM role ARN to assume via GitHub OIDC (s3:PutObject
#                           on the bundle key)
#   vars.SOAK_AWS_REGION  - region (default us-east-1)
on:
  push:
    branches: [master]
    paths: [src/**, examples/vopr.rs, Cargo.toml, Cargo.lock, dev/ops/soak/**]
  workflow_dispatch: {}

permissions:
  id-token: write # for AWS OIDC
  contents: read

jobs:
  bundle:
    # The bucket check is the on/off switch; the ref check is the security half.
    # This job holds `id-token: write` and assumes a role with write access to
    # the soak bucket, and workflow_dispatch is satisfied at ANY ref — so
    # without this line `gh workflow run soak-bundle.yml --ref <branch>` would
    # build that branch's unreviewed code (build-vopr.sh runs from the checkout)
    # and hand it the role, with the resulting bundle landing on the key every
    # box in the running fleet pulls within ~10 min. The push trigger above is
    # already master-only, so the gate costs nothing a real run wanted. The
    # role's trust policy is documented (selfcheck.yml's header) as scoped to
    # the OIDC subject `ref:refs/heads/master`, which should refuse a branch at
    # assume-role — but that is AWS-side config no reader of this file can
    # verify, so it is the second layer, not the defense. Same class as ci.yml's
    # real-GCS job (9445aea), weekly.yml's real-S3 job (0b69727) and
    # selfcheck.yml (4db942c).
    if: >-
      vars.SOAK_S3_BUCKET != '' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04-arm # native arm64 → aarch64 binary, no cross-compile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # In the fleet's own AMI image, not the runner's userland: this runner is
      # glibc 2.39, Amazon Linux 2023 is 2.34, and a binary linked against the
      # newer one cannot start on the box — it exits 1 silently and the fleet
      # soaks nothing. build-vopr.sh is the same recipe `fleet.sh push-bundle`
      # runs, and it refuses to emit a binary that will not exec there.
      - name: Build vopr in the fleet's userland
        run: |
          mkdir -p stage
          # Digest-pinned (the multi-arch manifest list, not a platform digest —
          # this job runs on arm64). The tag is a rolling build; a silent glibc
          # bump inside it is exactly the drift build-vopr.sh guards against.
          docker run --rm -v "$PWD":/src:ro -v "$PWD/stage":/out -w /src \
            public.ecr.aws/amazonlinux/amazonlinux:2023@sha256:5d271dd33b628252c31c15f5449e50d7c4e9f93badf9342f9b1e2a8d326fbe84 \
            bash dev/ops/soak/build-vopr.sh
      - name: Stage bundle
        run: |
          git rev-parse --short HEAD > stage/commit
          cp dev/ops/soak/report.py dev/ops/soak/install.sh dev/ops/soak/fetch-bundle.sh \
             dev/ops/soak/pypiron-soak@.service dev/ops/soak/pypiron-soak-reporter.service \
             dev/ops/soak/pypiron-soak-refresh.service dev/ops/soak/pypiron-soak-refresh.timer stage/
          tar czf bundle.tar.gz -C stage .
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.SOAK_AWS_ROLE }}
          aws-region: ${{ vars.SOAK_AWS_REGION || 'us-east-1' }}
      # Through the environment, not through template expansion: a repo variable
      # interpolated straight into a shell line is a code-injection shape, and
      # zizmor flags it as one.
      - name: Upload bundle
        env:
          BUCKET: ${{ vars.SOAK_S3_BUCKET }}
          KEY: ${{ vars.SOAK_BUNDLE_KEY || 'soak/bundle.tar.gz' }}
        run: |
          aws s3 cp bundle.tar.gz "s3://${BUCKET}/${KEY}"
