name: Simulation

# Deterministic simulation testing plus the deep
# stateright model configurations. The merge gate runs a small VOPR
# smoke and the bounded model checks inside `cargo test`; this nightly job is
# where the real interleaving volume happens — simulated time costs nothing,
# so thousands of seeded fault schedules run per night. Every failure names
# the 8-byte seed that reproduces it exactly.
on:
  schedule:
    - cron: '30 3 * * *' # nightly, 03:30 UTC (fuzz runs at 03:00)
  workflow_dispatch:
    inputs:
      seeds:
        description: 'Seeds per profile'
        default: '50000'

env:
  CARGO_TERM_COLOR: always
  SEEDS: ${{ github.event.inputs.seeds || '50000' }}

permissions:
  contents: read

# Every `run:` step here ends in `| tee`, and a step with no `shell:` gets
# GitHub's default `bash -e {0}` — no `pipefail`, so the step exits with
# *tee's* status and a red run reports green. Both nightly jobs were incapable
# of failing: the VOPR exits 2/3 on a violated oracle and `cargo test` exits
# 101, and every one of those was being swallowed. `shell: bash` is the one
# that adds `-o pipefail` (`bash --noprofile --norc -eo pipefail {0}`), so it
# belongs at the workflow level where a future piped step inherits it too.
defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vopr:
    name: vopr (${{ matrix.profile.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile:
          # Fault profiles inject storage failures; the audit is a documented
          # safety net there, and its repair count is published below. The
          # crash-only profiles permit ZERO audit repairs: markers alone must
          # converge every crash schedule.
          #
          # `--packages 6 --files 2` is a durability floor, not a taste: the
          # three oracles that check acked bytes survive (DURABILITY,
          # VISIBILITY, CONSERVATION) skip any filename an authorized delete,
          # tombstone or conflict freeze removed, so their whole universe is
          # `packages x files` names. At 160 ops with a 10% delete weight the
          # harness default of 2x2 is fully tombstoned by quiesce on four seeds
          # in five — measured per seed, only 20% of this row's seeds evaluated
          # durability AT ALL, while the run still printed a five-figure hit
          # count. 12 names puts it at ~100% (dev/TESTING.md).
          #
          # Every flag a row runs lives in its own `args`. The step below adds
          # only --seeds/--start-seed/--require-reach, which are legal in both
          # modes — because the workload flags and --rotate are mutually
          # exclusive: --rotate derives the whole profile from the seed, so a
          # --ops beside it used to be parsed and silently discarded (the
          # rotating row below carried nodes/buckets/ops for exactly that long,
          # documented as "ignored"). The harness now refuses the pair outright,
          # so a shared template that pastes a topology onto every row cannot
          # start at all.
          - { name: single-bucket, args: '--nodes 2 --buckets 1 --ops 160 --packages 6 --files 2' }
          - { name: multi-bucket, args: '--nodes 3 --buckets 2 --ops 160 --packages 6 --files 2' }
          - { name: single-bucket-crash-only, args: '--nodes 3 --buckets 1 --ops 160 --packages 6 --files 2 --fail-percent 0' }
          - { name: multi-bucket-crash-only, args: '--nodes 3 --buckets 2 --ops 160 --packages 6 --files 2 --fail-percent 0' }
          # THREE buckets — the multi-region topology the product is marketed
          # on, and until 2026-07-27 the one no lane in this workflow ran. Every
          # row above tops out at two, which is not the same shape with a
          # smaller number in it: at two buckets a write has exactly one peer,
          # so the pre-ack fan-out, the `_repl/` debt it leaves behind and
          # `execute`'s per-PAIR work each ran once per pass and could not be
          # partially applied. At three they run twice, and a crash between the
          # two halves leaves a state two buckets cannot reach. That gap is not
          # theoretical: a DURABILITY defect that lost acknowledged bytes
          # fleet-wide with nothing authorizing their absence went unseen through
          # two multi-million-seed censuses and was only ever reproduced at
          # `--seed 65000024708 --nodes 3 --buckets 3 --packages 6 --files 4
          # --ops 200 --fail-percent 3 --partition 100` — GREEN on the same seed
          # at `--buckets 2`. It is `--packages 6 --files 2` like its
          # siblings, so the durability corpus stays at 12 filenames and the row
          # differs from `multi-bucket` in exactly one flag.
          - { name: three-bucket, args: '--nodes 3 --buckets 3 --ops 160 --packages 6 --files 2' }
          # The five above pin a topology AND the fixed workload (6 packages x 2
          # files, one hardcoded op mix), so between them they re-explore one
          # shape however many seeds they burn. This one rotates everything the
          # seed can vary — topology, entity counts, and the op-class weights
          # (swarm testing) — which is what found the class-2 global-index
          # divergence at seed 1067836. A failure reproduces with
          # `--seed N --rotate`.
          - { name: rotating-swarm, args: '--rotate' }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # Seeds rotate nightly (day number scales the start), so every night
      # explores fresh schedules while any night's failure still reproduces
      # from its printed seed.
      # `--require-reach` fails the run when any oracle recorded ZERO
      # executions over the sample, or executed on under 25% of its seeds: an
      # oracle that verified nothing is a defect report, not a pass, and a run
      # total hides that as well as a zero does — these rows once reported five
      # figures while 4 seeds in 5 evaluated an empty ledger. It lives here and
      # not on the PR smoke because it only means something at volume — 50,000
      # seeds per profile. Known-zero oracles are excused by name in
      # `EXPECTED_ZERO` (dev/TESTING.md).
      - name: Run seeded simulation
        run: |
          START=$(( ( $(date +%s) / 86400 ) * ${SEEDS} ))
          cargo run --release --example vopr -- \
            --seeds "${SEEDS}" --start-seed "${START}" \
            ${{ matrix.profile.args }} \
            --require-reach | tee vopr.out
      - name: Publish counters
        if: always()
        run: |
          echo '### VOPR — ${{ matrix.profile.name }}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # 22 lines of reach table + the summary above it.
          tail -30 vopr.out >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # NON-BLOCKING, and the reason is now stronger than the draw size: LIVE
  # CORRECTNESS DEFECTS are open below — the roster is kept entry by entry, and
  # closing one does not reopen the gate. Gating this job would not raise the bar,
  # it would paint the nightly permanently red — and a job nobody can fix is a
  # job nobody reads. `tests/simulation_matrix.rs` guards that in both
  # directions. Remove `continue-on-error` with the failures, not before.
  #
  # `--partition N` is the share of SEEDS whose fleet is partitioned: on those,
  # each node homes to its own bucket and authors truth there instead of every
  # writer pinning bucket 0. It is what finally makes `replicate::decide`'s merge
  # algebra execute at all, and that is measured, not asserted — the same binary
  # over the same five profiles at `--partition 0`, 1,235,949 control seeds:
  # seven of the eleven merge verdicts read `[never presented]` in EVERY lane
  # (AdoptSidecar, Supersede, QuarantineLoser, Freeze, PropagateFreeze,
  # FinishFreeze, SettleMirrorQuarantine) and all three evidence objects
  # (`.frozen`, `_quarantine/<pkg>/<file>@sha`, `.mirror-quarantined`) read
  # `[never created]`. Only Noop/Copy/Tombstone/Defer survive. So everything the
  # aligned matrix above proves, it proves about a fleet whose buckets never
  # disagree.
  #
  # RATE, censused 2026-07-27 at HEAD `08d94f2` over 5,417,063 fresh partitioned
  # seeds and 5.88e9 storage-op interleavings across five profiles: 6 failing
  # seeds = 1.11e-6 per seed, from 4 in 680,714 at the last census and 781 in
  # 488,363 (0.160%) at the one before. Every root cause the last census filed is
  # CLOSED and pinned in ci.yml — `f37e391` (DURABILITY, the stale settle),
  # `4eaa015` (CONSERVATION, the settle that destroyed a racing publish's body)
  # and `bb885ef` (SELF_CONSISTENCY, the non-crash-atomic supersede). The three
  # below were new at that census; all three are CLOSED since, so the 6-seed
  # count above is the rate BEFORE those fixes and the next census is what moves
  # it. Do not re-quote it as current.
  #
  # Read the pooled number with its caveat. The 4.1M-seed narrow lane in that
  # pool starves four oracles — at 1 package x 1 file the corpus is fully
  # tombstoned by quiescence on ~80% of its seeds, so DURABILITY, VISIBILITY,
  # CONSERVATION and SELF_CONSISTENCY iterate an empty set there (the exact
  # effect `tests/simulation_matrix.rs` pins the 12-filename corpus to prevent).
  # Only ~2.1M of the 5.4M seeds are durability-effective. The rest is real
  # merge-algebra coverage, not real durability coverage.
  #
  # THE ARITHMETIC, which is the whole gating argument. A draw of N seeds reds
  # with probability 1-(1-p)^N, and this job's N is 91,560 — what `--max-secs
  # 900` explores on a CI runner. Re-confirmed by running the exact invocation
  # below for its exact 900-second budget on a 10-core laptop: 186,398 seeds,
  # clean, so a CI runner is roughly half that and 91,560 stands.
  #   * pooled over every partitioned seed measured, 6 in 5,603,461:
  #     p = 1.07e-6  ->  9.3% of nights red.
  #   * this job's own profile alone, 1 in 577,903: p = 1.73e-6  ->  14.7%.
  #   * one red night in twenty needs p <= 5.6e-7: one failure per 1,785,029
  #     seeds. The best estimate is 1.9x that; its own profile is 3.1x.
  # The pooled rate is now a MEASURED NON-ZERO, 95% interval [4.7e-7, 2.1e-6].
  # When the count was zero, more soaking could earn the gate; it cannot now.
  # Only fixes can.
  #
  # Do NOT try to reach green by lowering `--partition`. `partition_for` draws
  # `rng.chance(percent)` once per SEED, so N is a share of seeds, not of writes:
  # halving it halves the partitioned seeds and the failure count together,
  # buying a quieter lane by testing proportionally less.
  #
  # THE FIRST ONE WAS NOT A PARTITIONED-LANE BUG AT ALL, which is why it was the
  # one that gated. Root cause 1 reproduced at `--partition 0`, on ONE bucket —
  # the GATED `rotating-swarm` row above, the row with no `continue-on-error`.
  # Rate over 2,525,228 `--rotate` seeds (1,866,968 of them at `--partition 0`,
  # all clean): 2 failures = 7.9e-7 per seed, so that row's 50,000-seed nightly
  # draw redded 3.9% of nights — one in 26, one in 9 at the 95% upper bound.
  # Small, never zero, and now closed; quote the figure only as the pre-fix rate.
  #
  #   1. AUDIT_REPAIRED_VIEWS / AUDIT_PREMATURE_CONSUMPTION — CLOSED. The global
  #      index publishes HTML and JSON non-atomically and always will:
  #      `write_global_indexes_cas` writes `simple/index.html` first and
  #      `simple/index.json` second, so a crash or a storage failure between them
  #      strands the HTML ahead and the bucket serves a PEP 503 index listing a
  #      package its own PEP 691 index does not. The defect was never the tear —
  #      it was that only the tier-3 audit healed it, and an audit that has to
  #      repair a view is what the oracle reds on. Two fixes to the no-op gate in
  #      `update_global_index_locked` made the marker path heal it instead:
  #        * the HTML's ETag joined the currency probe, so a pair a peer moved
  #          clears `html_current` and reconciles. Closed the crash-only arm —
  #          seeds 60000037578 and 61000075134, both since PASSING at `a53b7e9`.
  #        * an ABSENT canonical JSON now forces a reload. Its ETag is `None`,
  #          and `None` compares EQUAL to the `None` a cache pinned at cold
  #          start, so the probe read "JSON unchanged" and skipped the fresh
  #          `load_global_names` that is the only thing that sets `stranded` and
  #          writes the JSON back. The reconcile below then rewrote the live HTML
  #          down to that same stale (empty) cached name set and consumed the
  #          markers, so the tear outlived the only signal that covered it. A
  #          published HTML standing over an absent JSON is now read as the torn
  #          pair it is.
  #      The delta-empty early return in `update_global_index` is NOT a second
  #      hole. Markers are consumed LAST, and every path that can strand the pair
  #      — the tick, `drain_dirty_uncached`, a crash — returns before consuming
  #      them, so a tear always leaves behind the marker that brings the update
  #      path back to it.
  #        --seed 13792606396100784374 --rotate   # AUDIT_PREMATURE_CONSUMPTION; reds at `a53b7e9`, green since
  #      The other seeds this entry used to list (60000037578, 61000075134,
  #      61000246528, 66000074673) all PASS at `a53b7e9`: the first fix closed
  #      them and the list was never trimmed. Re-run before citing any of them.
  #
  #   2. DURABILITY — CLOSED. A demotion fence was cleared on a listing-era
  #      reading of the record, and the trace says the mechanism plainly: both
  #      pair merges ran `clear_spent_demotion_fence` on bucket 0 with the
  #      canonical key ALREADY EMPTY, because that bucket's own
  #      `settle_mirror_quarantine` had moved the body to `_quarantine/` between
  #      the listing and the executor. The fence was the only record that the
  #      emptiness was authorized; deleting it left the filename empty on all
  #      three buckets with no tombstone and no `.frozen` — the state
  #      `origin release` hands back to a proxy to re-fetch the artifact just
  #      suppressed. Not a per-pair arithmetic bug: at two buckets the same stale
  #      clear loses the same fence, and three buckets is what made the seed
  #      land there (the fan-out's fence write to bucket 2 crashed, so no peer
  #      held a copy). Fixed by reading live truth through the primitive
  #      `settle_mirror_quarantine` already uses, so both sides of the race
  #      answer the same question against the same keys at the moment they act.
  #      Pinned by `replicate::tests::a_stale_spent_fence_clear_never_unauthorizes_a_settled_demotion`.
  #        --seed 65000024708 --nodes 3 --buckets 3 --packages 6 --files 4 --ops 200 --fail-percent 3 --partition 100
  #      THREE BUCKETS IS THE MARKETED MULTI-REGION TOPOLOGY and no lane ran it,
  #      which is how this survived. Both halves are covered now: the gated
  #      matrix carries a `three-bucket` row at `--partition 0` for the fan-out
  #      and `_repl/` debt paths, and this job carries a partitioned
  #      `three-bucket` lane for the merge algebra — the exact cross product the
  #      seed above needed, and which neither half alone reproduces.
  #
  #   3. CONVERGENCE + SELF_CONSISTENCY + DURABILITY — CLOSED, and it was not a
  #      symmetry hole in the merge algebra. Bucket 0 ended serving one byte-set
  #      under the OTHER's published sha256, with no `.frozen` and no
  #      `.superseding` — so a second SELF_CONSISTENCY producer beside the
  #      mid-supersede crash `bb885ef` closed, but a torn write after all, and
  #      the tear was not in the copy. `copy_live` lands the artifact before the
  #      sidecar precisely so the sidecar can only ever describe bytes the bucket
  #      holds; `settle_mirror_quarantine`'s delete landed between the two legs
  #      and retracted that ownership, the sidecar published over an emptied key,
  #      and a racing create took it with different bytes. Permanent from there:
  #      `decide` compares sidecar shas, both buckets read as agreed, and nothing
  #      re-hashes a stored body. Fixed by re-checking the body under the key
  #      before publishing truth about it. Pinned by
  #      `replicate::tests::a_copy_never_publishes_truth_over_a_body_the_bucket_lost`
  #      and by the seed in ci.yml.
  #        --seed 62000150551 --nodes 3 --buckets 2 --packages 6 --files 2 --ops 160 --fail-percent 3 --partition 100
  #      (PASSES at `--partition 0`.)
  #      Same delete, one more victim, closed in the same commit: with nothing
  #      preserved the settle read the key empty and deleted it anyway, so a
  #      publish creating it in that gap was acked 200 and its bytes then existed
  #      nowhere (`--seed 86001009016 --nodes 3 --buckets 2 --packages 1 --files 1
  #      --ops 26 --fail-percent 1 --partition 100`). A re-read cannot close
  #      either window — `delete_keys` is unconditional — so the authorization is
  #      now the `_quarantine/` copy, not a reading of the key.
  #
  # This lane's profile is the wrong instrument for two of the three, in opposite
  # directions. Root cause 1's `AUDIT_PREMATURE_CONSUMPTION` arm and all three of
  # the last census's bugs were found on NARROW lanes (1-2 packages, 1 file,
  # 40-80 ops), where contention concentrates on a single filename; the
  # 12-filename corpus here spreads the workload too thin to reach them. That
  # corpus is load-bearing for the durability oracles
  # (`tests/simulation_matrix.rs` enforces it), so add a narrow lane when hunting
  # the next one — do not widen or shrink this one. Root cause 2 was the mirror
  # image: it needed a THIRD bucket, which nothing here provides.
  #
  # Coverage is intact rather than suppressed: over the 5,417,063 census seeds
  # all 11 `decide` verdicts execute and none reads `[never presented]` in any of
  # the five lanes, `.frozen` stands at quiescence on 19.4% of seeds,
  # `_quarantine/` on 22.2% and `.mirror-quarantined` on 0.02%.
  vopr-partitioned:
    name: vopr (partitioned ${{ matrix.lane.name }} — NON-BLOCKING, coverage lane)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        lane:
          # The `multi-bucket` row above plus one flag, so the two are directly
          # comparable — same topology, same 12-filename durability corpus,
          # same op mix; the only difference is who authored the writes.
          - { name: two-bucket, offset: 4000000000, args: '--nodes 3 --buckets 2 --ops 160 --packages 6 --files 2 --partition 100' }
          # THE MISSING CROSS PRODUCT. The gated matrix gained a `three-bucket`
          # row on 2026-07-27, but at `--partition 0` — so it covers the
          # pre-ack fan-out and the `_repl/` repair debt at three buckets and
          # NOT the merge algebra, which at `--partition 0` never executes at
          # all (seven of eleven `decide` verdicts read `[never presented]` over
          # 1,235,949 control seeds). Three buckets is the marketed multi-region
          # topology and the two gaps compose: the DURABILITY defect at `--seed
          # 65000024708` needed a third bucket AND partitioned authorship
          # together, and was green under either one alone. This row is the
          # `three-bucket` row and the `two-bucket` row above crossed, which is
          # the only lane that runs the shape that bug lived in.
          - { name: three-bucket, offset: 5000000000, args: '--nodes 3 --buckets 3 --ops 160 --packages 6 --files 2 --partition 100' }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # `--max-secs` instead of `--seeds`, because this lane's output is a RATE,
      # not a verdict: without it the run stops at its first failing seed (~300
      # seeds in) and reports nothing you can watch trend. It also bounds the
      # wall clock by construction — 15 minutes of simulation regardless of how
      # slow the runner is, well inside the 60-minute job timeout. `--seeds` is
      # deliberately absent: `--max-secs` supersedes it, and a flag that is
      # parsed and discarded is the defect the matrix above is shaped to avoid.
      # The start seed strides 1,000,000/night — far more than a lane can
      # explore in 15 minutes — so no two nights share a schedule, and each
      # lane's own offset keeps it clear of the aligned rows and of its sibling.
      - name: Run partitioned simulation
        run: |
          START=$(( ${{ matrix.lane.offset }} + ( $(date +%s) / 86400 ) * 1000000 ))
          cargo run --release --example vopr -- \
            --start-seed "$START" --max-secs 900 \
            ${{ matrix.lane.args }} \
            --require-reach | tee vopr.out
      - name: Publish counters
        if: always()
        run: |
          echo '### VOPR — partitioned ${{ matrix.lane.name }} (NON-BLOCKING, coverage lane)' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Watch the failing-seed count trend to zero; the open root causes and their' >> "$GITHUB_STEP_SUMMARY"
          echo 'minimized repros are in the job comment in `.github/workflows/simulation.yml`.' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # The summary line spells out every failing seed, which runs to
          # hundreds — keep the counts, drop the two rosters. A green run has no
          # brackets to strip.
          grep -a '^vopr: [0-9]* seeds explored' vopr.out \
            | sed -E 's/ \[[0-9, ]*\]//g' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          grep -a '^reproduce:' vopr.out | head -3 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # The read pin is the one selection surface neither tier above touches: the
  # VOPR has no read-affinity op and both stateright models stop at the write
  # pin, which is why the two defects `cc9627d` fixed shipped. This lane closes
  # that class in-crate — a randomized conformance walk driving the REAL
  # `HealthController` (not a transcription, so a transcription gap cannot hide a
  # bug) through fault/upload/drain schedules. dev/TESTING.md has the details;
  # the fast tier runs on every merge inside `cargo test`.
  read-pin-walk:
    name: read-pin conformance walk (deep)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # Seeds stride by day like the VOPR rows: every night explores fresh
      # schedules, and any night's failure still reproduces from its printed
      # seed alone. 5M seeds is ~10 minutes on a runner, and the timeout above
      # leaves room for a cold release build on top.
      - name: Walk the read pin through randomized fault schedules
        env:
          PYPIRON_WALK_SEEDS: '5000000'
        run: |
          PYPIRON_WALK_START=$(( ( $(date +%s) / 86400 ) * 5000000 )) \
            cargo test --release --lib read_pin_conformance_walk_deep \
            -- --ignored --nocapture 2>&1 | tee walk.out
      # `--ignored` runs ONLY ignored tests and libtest exits 0 when a filter
      # matches nothing, so a rename or an un-ignore would leave this job running
      # nothing and reporting success. Name what must run.
      - name: Assert the deep walk actually ran
        run: |
          grep -qE '^test bucket_health::conformance_walk::read_pin_conformance_walk_deep \.\.\. ok' walk.out || {
            echo 'read_pin_conformance_walk_deep did not run — the nightly walk is empty' >&2
            exit 1
          }
      - name: Publish the sample size
        if: always()
        run: |
          echo '### Read-pin conformance walk' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -aE '^read-pin conformance walk:|^  (reproduce|seed|topology|boot|step|detail):' walk.out \
            >> "$GITHUB_STEP_SUMMARY" || echo '(no result line — the walk did not complete)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  model-deep:
    name: stateright (deep configurations)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Exhaustively check the deep model configurations
        run: |
          cargo test --release --test model_replication --test model_event_protocol \
            -- --ignored --nocapture 2>&1 | tee model.out
      # `--ignored` runs ONLY ignored tests, and libtest exits 0 when a filter
      # matches nothing — so a renamed or un-ignored config leaves this job
      # running nothing and still reporting success. Name what must run: the
      # other ignored tests here are visualizer dumps that no-op without
      # PYPIRON_VIZ_GRAPH, so a result line alone proves nothing.
      # `model_replication_deep` is deliberately absent — it is cheap enough
      # (61k states, 265 ms) that it runs on the merge gate now.
      - name: Assert the deep configuration actually ran
        run: |
          grep -qE '^test model_event_protocol_deep \.\.\. ok' model.out || {
            echo 'model_event_protocol_deep did not run — the nightly deep check is empty' >&2
            exit 1
          }
      - name: Publish state counts
        if: always()
        run: |
          echo '### Stateright — deep configurations' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "unique states|test result" model.out >> "$GITHUB_STEP_SUMMARY" \
            || echo '(no state counts — the check did not complete)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
