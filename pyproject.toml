[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "pypiron"
dynamic = ["version"]
description = "A fast, reliable, and scalable PyPI server"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Blackthorn Interstellar" }
]
keywords = ["pypi", "package-server", "rust", "s3"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: System :: Software Distribution",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/blackthorn-interstellar/pypiron"
Repository = "https://github.com/blackthorn-interstellar/pypiron"
Documentation = "https://pypiron.com/"
Issues = "https://github.com/blackthorn-interstellar/pypiron/issues"
Changelog = "https://github.com/blackthorn-interstellar/pypiron/releases"

[tool.maturin]
# "bin" bindings means we're packaging a Rust binary, not a Python extension
bindings = "bin"
# Strip debug symbols to reduce binary size
strip = true

[tool.uv]
# Don't build/install the crate on `uv sync`: that's a full maturin release
# build (~2.5 min in CI) and nothing consumes it — the test suite builds and
# runs the debug binary itself (tests/helpers.py ensure_built). Release wheels
# are built by maturin-action in CI, which doesn't go through uv sync.
package = false

[dependency-groups]
dev = [
    "maturin",
    "packaging>=25.0",
    "pytest>=7",
    "pytest-xdist>=3",
    "requests>=2.31",
    "ruff>=0.15",
    "tenacity>=8.2",
    "twine",
    "uv",
]
# User-facing docs site (mkdocs-material). Build: `make docs`; serve: `make docs-serve`.
docs = [
    "mkdocs-llmstxt>=0.4.0",
    "mkdocs-material>=9.5",
]

[tool.pytest.ini_options]
# All regenerable local state lives under .local/ so the repo root stays legible.
cache_dir = ".local/pytest_cache"
markers = [
    "stress: long-running, network-heavy tests (disabled by default)",
    "integration: integration tests that may hit the network or spawn services",
    "s3: tests that require Docker/MinIO S3 emulation",
    "azure: tests that require Docker/Azurite Azure Blob emulation",
    "gcs: end-to-end tests against a real GCS bucket (no emulator; skips unless PYPIRON_TEST_GCS_REAL_BUCKET is set)",
    "perf: performance benchmarks against the release binary (disabled by default)",
    "chaos: crash-point fault injection sweeps (slow-ish, deterministic)",
    "compat(client, feature): client compatibility coverage point for docs/reference/compatibility.md",
    "devpi: migration tests that drive a real devpi-server (fetched via uv tool run) as the source; skip cleanly when devpi can't be fetched/started",
]
# -n auto: tests isolate by uuid bucket/container/port, so they parallelize.
# The serial-only targets (perf timing, the compat doc's result aggregation,
# real-bucket runs that wipe a shared bucket) pass -n 0 in the Makefile.
addopts = "-m 'not perf and not stress' -n auto"
testpaths = [
    "tests",
]

[tool.ruff]
line-length = 100
cache-dir = ".local/ruff_cache"

[tool.ruff.lint]
# Deliberately minimal: pyflakes (real bugs — unused imports, undefined names)
# plus import sorting. Line length and other style are left to the formatter,
# not enforced as lint noise.
select = ["F", "I"]
