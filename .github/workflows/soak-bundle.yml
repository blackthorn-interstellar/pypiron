name: Soak bundle

# Build the aarch64 VOPR binary + ops scripts into the S3 bundle the soak fleet
# runs. On every master push the fleet self-refreshes onto the new bundle within
# ~10 min — this is how a merged fix reaches the running soak. Inert until you
# set the repo variables below, so it never fails on an unconfigured repo:
#   vars.SOAK_S3_BUCKET   - target bucket (e.g. my-bucket)
#   vars.SOAK_BUNDLE_KEY  - key (default soak/bundle.tar.gz)
#   vars.SOAK_AWS_ROLE    - IAM role ARN to assume via GitHub OIDC (s3:PutObject
#                           on the bundle key)
#   vars.SOAK_AWS_REGION  - region (default us-east-1)
on:
  push:
    branches: [master]
    paths: [src/**, examples/vopr.rs, Cargo.toml, Cargo.lock, dev/ops/soak/**]
  workflow_dispatch: {}

permissions:
  id-token: write # for AWS OIDC
  contents: read

jobs:
  bundle:
    if: vars.SOAK_S3_BUCKET != ''
    runs-on: ubuntu-24.04-arm # native arm64 → aarch64 binary, no cross-compile
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      # In the fleet's own AMI image, not the runner's userland: this runner is
      # glibc 2.39, Amazon Linux 2023 is 2.34, and a binary linked against the
      # newer one cannot start on the box — it exits 1 silently and the fleet
      # soaks nothing. build-vopr.sh is the same recipe `fleet.sh push-bundle`
      # runs, and it refuses to emit a binary that will not exec there.
      - name: Build vopr in the fleet's userland
        run: |
          mkdir -p stage
          docker run --rm -v "$PWD":/src:ro -v "$PWD/stage":/out -w /src \
            public.ecr.aws/amazonlinux/amazonlinux:2023 \
            bash dev/ops/soak/build-vopr.sh
      - name: Stage bundle
        run: |
          git rev-parse --short HEAD > stage/commit
          cp dev/ops/soak/report.py dev/ops/soak/install.sh dev/ops/soak/fetch-bundle.sh \
             dev/ops/soak/pypiron-soak@.service dev/ops/soak/pypiron-soak-reporter.service \
             dev/ops/soak/pypiron-soak-refresh.service dev/ops/soak/pypiron-soak-refresh.timer stage/
          tar czf bundle.tar.gz -C stage .
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.SOAK_AWS_ROLE }}
          aws-region: ${{ vars.SOAK_AWS_REGION || 'us-east-1' }}
      - name: Upload bundle
        run: |
          aws s3 cp bundle.tar.gz \
            "s3://${{ vars.SOAK_S3_BUCKET }}/${{ vars.SOAK_BUNDLE_KEY || 'soak/bundle.tar.gz' }}"
