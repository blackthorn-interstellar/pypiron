# gitleaks config. Auto-loaded from the scan root by the secrets job in
# .github/workflows/security.yaml, which walks the full git history.
[extend]
useDefault = true

[allowlist]
description = "Placeholder credentials from the manual and the dev scripts"
# The manual teaches auth with `curl -u admin:secret` (and once `reader:secret`)
# against a local dev server — `make run` starts exactly that pair. The default
# curl-auth-user rule flags every one of those 31 lines across README.md and
# docs/. `admin:smoke` is the same story in dev/scripts/image-smoke.sh: the
# throwaway container it talks to gets PYPIRON_ADMIN_PASS=smoke a few lines
# earlier. Allowlisting the three literals rather than the rule, the docs/ tree
# or the script path is the narrow fix: any OTHER credential that ever appears
# after `curl -u`, in docs or anywhere else, still fails the scan.
regexes = [
  '''^admin:secret$''',
  '''^reader:secret$''',
  '''^admin:smoke$''',
  # A fixed HMAC key for a throwaway test server (tests/test_token_auth.py);
  # it signs nothing outside that test.
  '''^test-signing-key-0123456789abcdef$''',
]

# Deliberately NOT allowlisted: generated trees (target/, .local/) and the fuzz
# corpus. They are gitignored or tracked-on-purpose, and history — which is what
# this scan walks — never held the generated ones anyway.
