site_name: pypiron
site_description: An ultra-fast Python package server, written in Rust.
site_author: Blackthorn Interstellar
site_url: https://pypiron.com/
copyright: 'Copyright &copy; 2025 Blackthorn Interstellar &middot; <a href="/privacy/">Privacy</a> &middot; <a href="/for-agents/">For LLMs</a>'

# Build output lands under .local/ with the rest of the regenerable local state.
site_dir: .local/site

repo_url: https://github.com/blackthorn-interstellar/pypiron
repo_name: blackthorn-interstellar/pypiron
edit_uri: edit/master/docs/

theme:
  name: material
  # Dot-prefixed so mkdocs skips it when walking docs_dir (it's a template
  # directory, not a page).
  custom_dir: docs/.overrides
  logo: assets/pypiron-logo-256.png
  favicon: assets/pypiron-logo-256.png
  features:
    # navigation.sections is deliberately absent: groups render collapsed, so
    # the sidebar shows seven items, not the whole sitemap.
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    # Built-in default (light) / slate (dark) schemes, recolored to the iron &
    # rust palette in stylesheets/pypiron.css. Building on slate means we inherit
    # its complete, dark-correct variable set (shadows, code highlighting,
    # admonition/table colors) instead of re-deriving it by hand.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/pypiron.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.magiclink
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Published but deliberately outside the nav: the per-competitor pages keep
# their search-landing URLs, and the footer links carry privacy + for-agents.
not_in_nav: |
  compare/pypiron-vs-devpi.md
  compare/pypiron-vs-pypiserver.md
  compare/pypiron-vs-artifactory.md
  for-agents.md
  privacy.md

# Fail strict builds when a page's `description:` is missing, unparsed (an
# unquoted `: ` breaks the YAML and mkdocs silently renders the block into the
# page body), or over 160 chars.
hooks:
  - dev/scripts/mkdocs_check_meta.py

plugins:
  - search
  # Emit /llms.txt (an index) and /llms-full.txt (every page inlined) for coding
  # agents that fetch them when pointed at docs. This list does NOT track nav —
  # every published page must be listed here by hand or it silently vanishes
  # from llms.txt (including the off-nav pages above).
  - llmstxt:
      full_output: llms-full.txt
      sections:
        Overview:
          - index.md
        Core concepts:
          - concepts.md
        Deploy guides:
          - guides/standard-cloud.md
          - guides/air-gapped.md
          - guides/multi-region.md
          - guides/migrate.md
        Security and testing:
          - security.md
          - testing.md
        Reference:
          - reference/configuration.md
        Compare:
          - compare/index.md
          - compare/pypiron-vs-devpi.md
          - compare/pypiron-vs-pypiserver.md
          - compare/pypiron-vs-artifactory.md
        For agents:
          - for-agents.md
          - privacy.md

nav:
  - Overview: index.md
  - Core concepts: concepts.md
  - Deploy guides:
      - Standard cloud deploy: guides/standard-cloud.md
      - Air-gapped deploy: guides/air-gapped.md
      - Multi-region & multi-cloud: guides/multi-region.md
      - Migrate from another server: guides/migrate.md
  - Security features: security.md
  - Gauntlet testing: testing.md
  - Configuration: reference/configuration.md
  - Comparison & benchmarks: compare/index.md
