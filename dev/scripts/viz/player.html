    function inspect(id) {
      var n = byId[id];
      iBody.textContent = '';
      if (!n) { iBody.appendChild(el('p', 'foot', 'no such state')); return; }
      var head = el('p');
      head.appendChild(el('span', 'badge on', 'state ' + n.id));
      head.appendChild(el('span', 'badge', 'depth ' + n.depth));
      var f = n.flags || {};
      head.appendChild(el('span', f.quiescent ? 'badge on' : 'badge', f.quiescent ? 'quiescent' : 'not quiescent'));
      head.appendChild(el('span', f.converged ? 'badge ok' : 'badge dead', f.converged ? 'converged' : 'not converged'));
      iBody.appendChild(head);
      var s = n.state || {};
      section(function () {
        if (!s.buckets) return;
        s.buckets.forEach(function (b, bi) {
          var h = el('p', 'foot');
          h.style.marginTop = '8px';
          h.textContent = 'bucket-' + bi + (b.pkg_origin ? '  origin ' + b.pkg_origin : '');
          iBody.appendChild(h);
          (b.files || []).forEach(function (fr) {
            var line = el('div');
            line.appendChild(el('span', 'mono', fr.file || '?'));
            line.appendChild(doc.createTextNode(' '));
            line.appendChild(el('span', fr.artifact ? 'badge ok' : 'badge', 'artifact ' + (fr.artifact === null || fr.artifact === undefined ? 'absent' : fr.artifact)));
            if (!fr.sidecar) {
              line.appendChild(el('span', 'badge', 'sidecar absent'));
            } else if (typeof fr.sidecar === 'object') {
              /* one badge per sidecar field, so a long dump cannot overflow */
              line.appendChild(el('span', 'badge on', 'sidecar'));
              Object.keys(fr.sidecar).forEach(function (sk) {
                var sv = fr.sidecar[sk];
                if (sv === false || sv === null || sv === undefined) return;
                line.appendChild(el('span', 'badge', sk + (sv === true ? '' : ' ' + sv)));
              });
            } else {
              line.appendChild(el('span', 'badge on', 'sidecar ' + fr.sidecar));
            }
            if (fr.tombstoned) line.appendChild(el('span', 'badge dead', 'tombstoned'));
            if (fr.frozen) line.appendChild(el('span', 'badge on', 'frozen'));
            if (fr.mirror_quarantined) line.appendChild(el('span', 'badge on', 'mirror-quarantined'));
            iBody.appendChild(line);
          });
          if (b.quarantine && b.quarantine.length) {
            var q = el('div');
            q.appendChild(el('span', 'badge', 'quarantine: ' + b.quarantine.length));
            b.quarantine.forEach(function (qq) {
              q.appendChild(el('span', 'badge', typeof qq === 'object' ? JSON.stringify(qq) : String(qq)));
            });
            iBody.appendChild(q);
          }
        });
      });
      /* Two models, two shapes: the replication model's `writers` is an array
         of writer records, the event-protocol model's is an object keyed by
         writer name whose values are program counters. Render either. */
      section(function () {
        if (!s.writers) return;
        var list = Array.isArray(s.writers)
          ? s.writers.map(function (w, wi) { return ['w' + wi, w]; })
          : Object.keys(s.writers).map(function (k) { return [k, s.writers[k]]; });
        if (!list.length) return;
        var wh = el('p', 'foot');
        wh.style.marginTop = '8px';
        wh.textContent = 'writers';
        iBody.appendChild(wh);
        list.forEach(function (pair) {
          var name = pair[0], w = pair[1];
          var line = el('div');
          if (w && typeof w === 'object') {
            line.appendChild(el('span', 'badge on', name + (w.pc === undefined ? '' : '  pc ' + w.pc)));
            if (w.bucket !== undefined && w.bucket !== null) {
              line.appendChild(el('span', 'badge', 'bucket-' + w.bucket));
            }
            if (w.kind !== undefined && w.kind !== null) line.appendChild(el('span', 'mono', ' ' + w.kind));
          } else {
            line.appendChild(el('span', 'badge on', name));
            line.appendChild(el('span', 'mono', ' ' + (w === null ? 'null' : String(w))));
          }
          iBody.appendChild(line);
        });
      });
      section(function () {
        var rest = {};
        Object.keys(s).forEach(function (k) { if (k !== 'buckets' && k !== 'writers') rest[k] = s[k]; });
        if (!Object.keys(rest).length) return;
        var rh = el('p', 'foot');
        rh.style.marginTop = '8px';
        rh.textContent = 'projection';
        iBody.appendChild(rh);
        iBody.appendChild(kvTable(rest));
      });
      section(function () {
        if (!n.props || !n.props.length) return;
        var pp = el('p', 'foot');
        n.props.forEach(function (x) { pp.appendChild(el('span', 'badge ok', x)); });
        iBody.appendChild(pp);
      });
      section(function () {
        if (typeof n.raw !== 'string' || !n.raw) return;
        var pre = el('pre');
        pre.appendChild(el('code', null, n.raw));
        iBody.appendChild(pre);
      });
      /* outgoing transitions, with the real Verdict on merge edges */
      section(function () {
        var outs = edges.filter(function (e) { return e.from === id; });
        if (!outs.length) return;
        var oh = el('p', 'foot');
        oh.style.marginTop = '8px';
        oh.textContent = outs.length + ' outgoing transition' + (outs.length === 1 ? '' : 's');
        iBody.appendChild(oh);
        outs.forEach(function (e) {
          var line = el('div');
          line.appendChild(el('span', 'mono', e.action === undefined || e.action === null ? '(end)' : e.action));
          line.appendChild(doc.createTextNode(' → ' + e.to + ' '));
          if (e.verdict) line.appendChild(el('span', 'badge on', e.verdict));
          if (!e.tree) line.appendChild(el('span', 'badge', 'join'));
          iBody.appendChild(line);
        });
      });
    }
    if (nodes.length) inspect(nodes[0].id);

    /* --- path selection + playback --- */
    var cur = -1;
    function highlight() {
      var path = cur >= 0 ? (g.paths || [])[cur] : null;
      var onEdge = {};
      var onNode = {};
      if (path) {
        var steps = path.steps || [];
        for (var i = 0; i + 1 < steps.length; i++) {
          onEdge[steps[i].id + '>' + steps[i + 1].id] = steps[i].action;
          onNode[steps[i].id] = 1;
        }
        if (steps.length) onNode[steps[steps.length - 1].id] = 1;
      }
      edgeEls.forEach(function (x) {
        var on = path && onEdge[x.e.from + '>' + x.e.to] !== undefined;
        x.node.setAttribute('stroke', on ? T.accent : (x.e.tree ? T.border : T.muted));
        x.node.setAttribute('stroke-width', on ? 2.4 : (x.e.tree ? 1.2 : 0.9));
        x.node.setAttribute('opacity', path ? (on ? 1 : 0.25) : (x.e.tree ? 1 : 0.75));
      });
      Object.keys(nodeEls).forEach(function (id) {
        var on = !path || onNode[id];
        nodeEls[id].setAttribute('opacity', on ? 1 : 0.3);
      });
    }
    sel.addEventListener('change', function () {
      cur = parseInt(sel.value, 10);
      var path = cur >= 0 ? (g.paths || [])[cur] : null;
      PL.total = path ? Math.max(0, (path.steps || []).length - 1) : 0;
      PL.i = 0;
      highlight();
      view.seek(0);
      updatePos();
      qs('#controls').hidden = !CHROME || !PL.total;
      qs('#keys').hidden = !CHROME || !PL.total;
    });

    var view = {
      seek: function (i) {
        var path = cur >= 0 ? (g.paths || [])[cur] : null;
        if (!path) { stepOut.textContent = ''; return; }
        var steps = path.steps || [];
        var s = steps[clamp(i, 0, steps.length - 1)];
        if (!s) return;
        stepOut.textContent = '';
        stepOut.appendChild(el('span', 'badge on', 'step ' + (i + 1) + '/' + steps.length));
        stepOut.appendChild(el('span', 'mono', ' ' + (s.action === null || s.action === undefined ? '(end of path)' : s.action) + ' '));
        if (s.verdict) stepOut.appendChild(el('span', 'badge on', s.verdict));
        Object.keys(nodeEls).forEach(function (id) {
          nodeEls[id].setAttribute('stroke', (+id === s.id) ? T.accent : ((byId[id].flags || {}).converged ? T.ok : T.border));
          nodeEls[id].setAttribute('stroke-width', (+id === s.id) ? 3 : ((byId[id].flags || {}).converged ? 1.6 : 1));
        });
        inspect(s.id);
      }
    };
    highlight();
    return view;
  }

  /* ------------------------------------------------------------------ *
   * 7. scale mode — every number carries its source, visibly
   * ------------------------------------------------------------------ */

  function renderScale(s, host, loopPanel) {
    host.hidden = false;
    host.textContent = '';
    var stats = (s.stats || []).slice();
    var head = null;
    for (var i = 0; i < stats.length; i++) {
      if (stats[i].headline) { head = stats.splice(i, 1)[0]; break; }
    }
    if (!head && stats.length) head = stats.shift();

    var band1 = el('div', 'odo');
    var col = el('div');
    if (head) {
      var big = el('div', 'big num', '0');
      col.appendChild(big);
      col.appendChild(el('p', 'lbl', head.label || ''));
      col.appendChild(el('p', 'src', head.source || 'NO SOURCE'));
      band1.appendChild(col);
      /* the odometer: 0 -> the headline figure over ~6 seconds */
      var target = typeof head.value === 'number' ? head.value : null;
      if (target === null) { big.textContent = String(head.value); }
      else {
        var t0 = performance.now();
        (function tick(now) {
          var p = clamp((now - t0) / 6000, 0, 1);
          var e = 1 - Math.pow(1 - p, 3);
          big.textContent = fmt(Math.round(target * e));
          if (p < 1) requestAnimationFrame(tick);
        })(t0);
      }
    }
    if (loopPanel) {
      var lw = el('div');
      lw.appendChild(loopPanel.canvas);
      var cap = el('p', 'src', 'one seeded run, looping at full speed: ' +
        (loopPanel.model.cmd || loopPanel.model.title));
      lw.appendChild(cap);
      band1.appendChild(lw);
    }
    host.appendChild(band1);

    var tiles = el('div', 'tiles');
    stats.forEach(function (st) {
      var t = el('div', 'tile');
      t.appendChild(el('div', 'v', typeof st.value === 'number' ? fmt(st.value) + (st.unit || '') : String(st.value)));
      t.appendChild(el('div', 'l', st.label || ''));
      var src = el('p', 'src', st.source || 'NO SOURCE');
      if (!st.source) src.style.color = T.bad;
      t.appendChild(src);
      if (st.live) {
        var p = el('p', 'src');
        p.appendChild(el('span', 'badge on', 'live: this machine, this commit'));
        t.appendChild(p);
      }
      tiles.appendChild(t);
    });
    host.appendChild(tiles);

    if (s.bars && s.bars.length) {
      var bars = el('div', 'bars');
      bars.appendChild(el('h2', null, 'Relative scale'));
      var max = 0;
      s.bars.forEach(function (b) { max = Math.max(max, +b.value || 0); });
      s.bars.forEach(function (b) {
        var d = el('div', 'bar');
        var lab = el('div', 'bl');
        lab.appendChild(el('span', null, b.label || ''));
        lab.appendChild(el('span', null, fmt(b.value)));
        d.appendChild(lab);
        var rail = el('div', 'rail');
        var fill = el('div', 'fill');
        fill.style.width = (max ? (+b.value || 0) / max * 100 : 0) + '%';
        rail.appendChild(fill);
        d.appendChild(rail);
        d.appendChild(el('p', 'src', b.source || 'NO SOURCE'));
        bars.appendChild(d);
      });
      host.appendChild(bars);
    }
  }

  /* ------------------------------------------------------------------ *
   * 8. recorder — built-in canvas.captureStream + MediaRecorder, guarded
   * ------------------------------------------------------------------ */

  var REC = { active: false, mr: null, chunks: [] };
  function initRecorder(canvas) {
    var btn = qs('#rec');
    if (!btn) return;
    var mime = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'].filter(function (m) {
      return typeof MediaRecorder !== 'undefined' && MediaRecorder.isTypeSupported &&
        MediaRecorder.isTypeSupported(m);
    })[0];
    if (!canvas || !canvas.captureStream || typeof MediaRecorder === 'undefined' || !mime) return;
    btn.hidden = false;
    btn.title = 'Record the stage canvas to a .webm file (the lanes and the world table). ' +
      'For the whole page use ?chrome=off&autoplay=1&loop=1 with a screen recorder.';
    btn.addEventListener('click', function () {
      if (REC.active) { REC.stop(); return; }
      var stream = canvas.captureStream(30);
      REC.chunks = [];
      try {
        REC.mr = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 6000000 });
      } catch (err) {
        btn.textContent = 'recording unavailable';
        return;
      }
      REC.mr.addEventListener('dataavailable', function (ev) { if (ev.data && ev.data.size) REC.chunks.push(ev.data); });
      REC.mr.addEventListener('stop', function () { });
      REC.mr.onstop = function () {
        var blob = new Blob(REC.chunks, { type: 'video/webm' });
        var a = el('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'pypiron-viz.webm';
        doc.body.appendChild(a);
        a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      };
      REC.mr.start(250);
      REC.active = true;
      btn.textContent = 'Stop recording';
      setPressed(btn, true);
      PL.goto(0);
      PL.play();
    });
    REC.stop = function () {
      if (!REC.active) return;
      REC.active = false;
      setPressed(btn, false);
      btn.textContent = 'Record .webm';
      try { REC.mr.stop(); } catch (err) { /* already stopped */ }
    };
  }
  REC.stop = function () { };

  /* ------------------------------------------------------------------ *
   * 9. payload loading: inline block, ?src=, or a dropped file
   * ------------------------------------------------------------------ */

  /* An error whose text this file wrote, and so may appear on the page. Every
     other throw is an unexpected one: it goes to the console, never into page
     copy, because a raw JS error string is not something to show a reader. */
  function loadError(msg) {
    var e = new Error(msg);
    e.shown = true;
    return e;
  }

  function parsePayload(text, name) {
    text = String(text).replace(/^﻿/, '').trim();
    if (!text) return null;
    /* A JSONL trace is many objects, one per line; a graph/scale payload is one
       object (pretty-printed or not). Try the single object first. */
    if (text.charAt(0) === '{' && /\n/.test(text) === false) {
      return finish(JSON.parse(text), name);
    }
    try {
      return finish(JSON.parse(text), name);
    } catch (err) {
      var rows = [];
      var lines = text.split('\n');
      for (var i = 0; i < lines.length; i++) {
        var l = lines[i].trim();
        if (!l) continue;
        try { rows.push(JSON.parse(l)); } catch (e2) { /* a torn last line: stop here */ }
      }
      if (!rows.length) throw err;
      return { kind: 'trace', rows: rows, name: name };
    }
  }
  function finish(obj, name) {
    if (obj && obj.kind === 'trace' && obj.lines) return { kind: 'trace', rows: obj.lines, name: name };
    if (obj && Array.isArray(obj)) return { kind: 'trace', rows: obj, name: name };
    if (obj && obj.kind === 'graph') { obj.name = name; return obj; }
    if (obj && obj.kind === 'scale') { obj.name = name; return obj; }
    if (obj && obj.t === 'meta') return { kind: 'trace', rows: [obj], name: name };
    throw loadError('payload has no recognizable "kind" (expected trace, graph or scale)');
  }

  function loadInline() {
    var tag = qs('#payload');
    if (!tag) return null;
    var txt = tag.textContent || '';
    if (!txt.trim()) return null;
    try { return [parsePayload(txt, 'inline payload')]; } catch (err) { fail(err); return null; }
  }

  /* A scale payload can name a trace to loop beside its odometer. Fetch it
     relative to the payload itself; a build-inlined page carries the events in
     `loop_trace_lines` instead. A failure here is not fatal — the numbers stand
     on their own. */
  function expand(payloads) {
    var s = payloads.filter(function (p) { return p.kind === 'scale'; })[0];
    if (!s || payloads.filter(function (p) { return p.kind === 'trace'; }).length) {
      return Promise.resolve(payloads);
    }
    if (s.loop_trace_lines && s.loop_trace_lines.length) {
      payloads.push({ kind: 'trace', rows: s.loop_trace_lines, name: 'loop trace' });
      return Promise.resolve(payloads);
    }
    if (typeof s.loop_trace !== 'string' || !s.loop_trace) return Promise.resolve(payloads);
    var url;
    try { url = new URL(s.loop_trace, new URL(s.name || '', location.href)).href; }
    catch (err) { return Promise.resolve(payloads); }
    return fetch(url).then(function (r) {
      if (!r.ok) throw loadError(url + ': HTTP ' + r.status);
      return r.text();
    }).then(function (t) {
      payloads.push(parsePayload(t, url));
      return payloads;
    })['catch'](function () { return payloads; });
  }

  function loadSrc(list) {
    return Promise.all(list.map(function (u) {
      return fetch(u).then(function (r) {
        if (!r.ok) throw loadError(u + ': HTTP ' + r.status);
        return r.text();
      }).then(function (t) { return parsePayload(t, u); });
    }));
  }

  function fail(err) {
    var ours = !!(err && err.shown);
    if (!ours && window.console && console.error) console.error('payload failed to render:', err);
    var box = qs('#loaderr');
    if (box) {
      box.textContent = ours ? err.message :
        'This payload could not be rendered. The error is in the browser console.';
    }
    var loader = qs('#loader');
    if (loader) loader.hidden = false;
  }

  /* ------------------------------------------------------------------ *
   * 10. mount
   * ------------------------------------------------------------------ */

  /* The run's own facts as chips. Built per trace, because on a two-trace page
     one shared chip row would silently describe only one of the runs. */
  function chipsFor(m) {
    var d = m.meta || {};
    var out = [];
    function add(k, v, hot) {
      if (v === null || v === undefined || v === '') return;
      var c = el('span', 'chip' + (hot ? ' hot' : ''));
      c.appendChild(el('b', null, v));
      c.appendChild(doc.createTextNode(' ' + k));
      out.push(c);
    }
    add('producer', m.producer);
    add('commit', d.commit);
    if (typeof d.seed === 'number') add('seed', d.seed);
    add('nodes', m.nodes);
    add('buckets', m.buckets);
    if (typeof d.ops === 'number') add('ops', fmt(d.ops));
    if (typeof d.packages === 'number') add('packages', d.packages);
    if (typeof d.fail_percent === 'number') add('% injected failure', d.fail_percent, d.fail_percent > 0);
    if (typeof d.partition_percent === 'number') add('% partitioned', d.partition_percent, d.partition_percent > 0);
    if (d.brk && d.brk !== 'none') add('break', d.brk, true);
    if (m.opCount) add('storage ops traced', fmt(m.opCount));
    var s = m.summary;
    if (s) {
      if (typeof s.trace_events === 'number' && s.trace_events) add('hashed trace events', fmt(s.trace_events));
      if (s.trace_hash) add('trace hash', s.trace_hash);
      if (typeof s.elapsed_ms === 'number') add('ms elapsed', fmt(s.elapsed_ms));
    }
    return out;
  }

  /* The verdict pill, straight from the summary line — never inferred. */
  function verdictPill(m) {
    var s = m.summary;
    if (!s) return { className: 'pill none', textContent: 'no summary line in this trace', title: '' };
    var vio = s.violations | 0;
    /* The recorded run's OWN verdict code. The simulator calls it
       `seed_exit_code` precisely because it is not the process exit code — a
       whole-run gate like `--require-reach` can fail a process whose traced
       seed reported 0 — and the region recorder still calls it `exit_code`.
       Read both, and never label either one "exit". */
    var code = typeof s.seed_exit_code === 'number' ? s.seed_exit_code :
      (typeof s.exit_code === 'number' ? s.exit_code : null);
    return {
      className: 'pill ' + (vio ? 'bad' : 'ok'),
      textContent: vio ? vio + ' violation' + (vio === 1 ? '' : 's') +
        (code === null ? '' : '  ·  run verdict ' + code) :
        'no violations' + (typeof s.acked === 'number' ?
          '  ·  ' + fmt(s.acked) + ' filename' + (s.acked === 1 ? '' : 's') + ' acked' : ''),
      /* `summary.acked` is the ledger's count of DISTINCT filenames whose
         publish acked. The stage tally counts individual acked requests. Two
         quantities, two labels, on purpose. */
      title: vio ? (code === null ? '' :
        'The verdict this recorded run reported for itself, from its summary line. ' +
        'It is not the process exit code: a whole-run gate can fail a process whose ' +
        'traced run reported a clean verdict.') :
        (typeof s.acked === 'number' ?
          'Distinct filenames whose publish acked, from this run’s summary line. ' +
          'The tally on the stage counts individual acked requests — a different number.' : '')
    };
  }

  function setHeader(payloads) {
    var titles = [], narr = [], cmds = [], caveats = [], chips = [];
    var summary = null, model = null;
    /* On a scale page the loop trace is a background visual, not the subject:
       its title and chips would drown the headline. Its caveats still show. */
    var scaleMode = payloads.some(function (p) { return p.kind === 'scale'; });
    var dualMode = payloads.filter(function (p) { return p.kind === 'trace'; }).length > 1;
    payloads.forEach(function (p) {
      if (p.kind === 'trace') {
        if (scaleMode) {
          p.model.caveats.forEach(function (c) { if (caveats.indexOf(c) < 0) caveats.push(c); });
          return;
        }
        titles.push(p.model.title);
        if (p.model.narration) narr.push(p.model.narration);
        if (p.model.cmd) cmds.push(p.model.cmd);
        p.model.caveats.forEach(function (c) { if (caveats.indexOf(c) < 0) caveats.push(c); });
        if (!summary && p.model.summary) summary = p.model.summary;
        if (!dualMode) model = p.model;   /* stacked panels carry their own */
      } else {
        if (p.title) titles.push(p.title);
        if (p.narration) narr.push(p.narration);
        if (p.generated_by) cmds.push(p.generated_by);
        (p.caveats || []).forEach(function (c) { if (caveats.indexOf(c) < 0) caveats.push(c); });
      }
    });
    var uniq = titles.filter(function (t, i) { return titles.indexOf(t) === i; });
    qs('#title').textContent = uniq.join('  ·  ') || 'pypiron run visualizer';
    var np = qs('#narr');
    np.textContent = '';
    var un = narr.filter(function (t, i) { return narr.indexOf(t) === i; });
    np.textContent = un.join('  ');
    np.hidden = !un.length;

    var pre = qs('#cmd');
    if (dualMode) cmds = [];
    if (cmds.length) {
      pre.hidden = false;
      pre.textContent = '';
      cmds.forEach(function (c, ix) {
        pre.appendChild(el('code', null, (ix ? '\n' : '') + c));
      });
    }

    if (model) chips = chipsFor(model);
    var chipBox = qs('#chips');
    chipBox.textContent = '';
    chips.forEach(function (c) { chipBox.appendChild(c); });

    var pill = qs('#verdict');
    var built = model ? verdictPill(model) : null;
    if (built) {
      pill.hidden = false;
      pill.className = built.className;
      pill.textContent = built.textContent;
      pill.title = built.title || '';
    }

    /* Caveats: always visible, never collapsible. */
    var cav = qs('#caveats');
    if (caveats.length) {
      cav.hidden = false;
      cav.textContent = '';
      cav.appendChild(el('h2', null, 'Caveats'));
      var ul = el('ul');
      caveats.forEach(function (c) { ul.appendChild(el('li', null, c)); });
      cav.appendChild(ul);
      padForCaveats();
    }
  }

  /* In recording mode the caveat band is fixed to the foot of the viewport —
     the only way a screen recording contains it — so the page needs room
     underneath for the end of its own content. */
  function padForCaveats() {
    var cav = qs('#caveats');
    doc.body.style.paddingBottom =
      (!CHROME && cav && !cav.hidden) ? (cav.offsetHeight + 18) + 'px' : '';
  }

  function mount(payloads) {
    payloads = payloads.filter(Boolean);
    if (!payloads.length) return;
    var loader = qs('#loader');

    /* trace payloads become panels; a graph or scale payload takes the page */
    var traces = [];
    payloads.forEach(function (p) {
      if (p.kind === 'trace') {
        p.model = buildTrace(p.rows || []);
        traces.push(p);
      }
    });
    var graph = payloads.filter(function (p) { return p.kind === 'graph'; })[0];
    var scale = payloads.filter(function (p) { return p.kind === 'scale'; })[0];

    var panelHost = qs('#panels');
    panelHost.textContent = '';
    PL.panels = [];
    PL.total = 0;
    var dual = traces.length > 1;
    if (dual) panelHost.classList.add('dual');
    traces.forEach(function (p) {
      var panel = TracePanel(p.model, dual);
      PL.panels.push(panel);
      PL.total = Math.max(PL.total, panel.total);
      if (!scale) panelHost.appendChild(panel.node);
    });

    setHeader(payloads);

    if (graph) {
      PL.graph = renderGraph(graph, qs('#graph'));
      PL.total = 0;
    }
    if (scale) {
      renderScale(scale, qs('#scale'), PL.panels[0] || null);
      if (PL.panels.length) {
        /* the scale page's loop trace runs itself: fastest speed, forever */
        PL.speed = 'max';
        LOOP = true;
        PL.play();
      }
    }

    if (loader) loader.hidden = true;
    var showChrome = CHROME && PL.total > 0;
    qs('#controls').hidden = !showChrome;
    qs('#keys').hidden = !showChrome;
    if (!CHROME) {
      doc.querySelectorAll('.chrome').forEach(function (n) { n.hidden = true; });
    }

    PL.panels.forEach(function (p) { p.buildTimeline(); });
    initRecorder(PL.panels.length ? PL.panels[0].canvas : null);
    /* ?at=N opens on a chosen event — a poster frame for a screenshot. */
    var at = parseInt(P.at, 10);
    if (at > 0) PL.i = clamp(at, 0, PL.total);
    PL.apply();
    if (AUTOPLAY && PL.total) PL.play();
    if (!PL.raf) PL.raf = requestAnimationFrame(frame);
  }

  /* ---- controls ---- */
  function nextIn(list, from) {
    for (var i = 0; i < list.length; i++) if (list[i] > from) return list[i];
    return list.length ? list[0] : null;
  }
  function jump(kind) {
    var best = null;
    PL.panels.forEach(function (p) {
      var list = kind === 'crash' ? p.crashIndices() : kind === 'vio' ? p.violationIndices() : p.phaseIndices();
      var n = nextIn(list, PL.i);
      if (n !== null && (best === null || n < best)) best = n;
    });
    if (best !== null) { PL.pause(); PL.goto(best); }
  }
  function prevPhase() {
    var best = null;
    PL.panels.forEach(function (p) {
      p.phaseIndices().forEach(function (i) { if (i < PL.i && (best === null || i > best)) best = i; });
    });
    PL.pause();
    PL.goto(best === null ? 0 : best);
  }

  function wireControls() {
    var sp = qs('#speeds');
    sp.appendChild(el('span', 'chip', 'speed'));
    SPEEDS.forEach(function (s) {
      var b = el('button', null, s === 'max' ? 'max' : s + '×');
      setPressed(b, s === PL.speed);
      b.addEventListener('click', function () {
        PL.speed = s;
        sp.querySelectorAll('button').forEach(function (x) { setPressed(x, x === b); });
      });
      sp.appendChild(b);
    });
    qs('#play').addEventListener('click', PL.toggle);
    qs('#step').addEventListener('click', function () { PL.pause(); PL.goto(PL.i + 1); });
    qs('#restart').addEventListener('click', function () { PL.goto(0); });
    qs('#nextcrash').addEventListener('click', function () { jump('crash'); });
    qs('#nextvio').addEventListener('click', function () { jump('vio'); });
    qs('#theme').addEventListener('click', function () {
      var cur = root.getAttribute('data-theme');
      var next = cur === 'light' ? 'dark' : cur === 'dark' ? '' : 'light';
      if (next) root.setAttribute('data-theme', next); else root.removeAttribute('data-theme');
      readTokens();
      PL.panels.forEach(function (p) { p.buildTimeline(); });
    });

    doc.addEventListener('keydown', function (ev) {
      if (ev.target && /^(INPUT|SELECT|TEXTAREA)$/.test(ev.target.tagName)) return;
      var k = ev.key;
      if (k === ' ') { ev.preventDefault(); PL.toggle(); }
      else if (k === 'ArrowRight') { PL.pause(); PL.goto(PL.i + 1); }
      else if (k === 'ArrowLeft') { PL.pause(); PL.goto(PL.i - 1); }
      else if (k === ']') jump('phase');
      else if (k === '[') prevPhase();
      else if (k === 'c') jump('crash');
      else if (k === 'v') jump('vio');
      else if (k === '0') PL.goto(0);
    });
  }

  /* ---- drag & drop / file picker ---- */
  function readFiles(files) {
    var list = Array.prototype.slice.call(files).slice(0, 2);
    Promise.all(list.map(function (f) {
      return (f.text ? f.text() : new Promise(function (res, rej) {
        var fr = new FileReader();
        fr.onload = function () { res(fr.result); };
        fr.onerror = rej;
        fr.readAsText(f);
      })).then(function (t) { return parsePayload(t, f.name); });
    })).then(expand).then(mount)['catch'](fail);
  }
  function wireDrop() {
    var loader = qs('#loader');
    ['dragover', 'dragenter'].forEach(function (t) {
      doc.addEventListener(t, function (ev) { ev.preventDefault(); if (loader) loader.classList.add('over'); });
    });
    doc.addEventListener('dragleave', function () { if (loader) loader.classList.remove('over'); });
    doc.addEventListener('drop', function (ev) {
      ev.preventDefault();
      if (loader) loader.classList.remove('over');
      if (ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files.length) readFiles(ev.dataTransfer.files);
    });
    var input = qs('#file');
    if (input) input.addEventListener('change', function () { readFiles(input.files); });
  }

  /* ---- theme + resize ---- */
  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme:dark)') : null;
  if (mq && mq.addEventListener) {
    mq.addEventListener('change', function () {
      readTokens();
      PL.panels.forEach(function (p) { p.buildTimeline(); });
    });
  }
  var rt = 0;
  window.addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(function () {
      PL.panels.forEach(function (p) { p.buildTimeline(); });
      padForCaveats();
    }, 120);
  });

  /* ---- go ---- */
  wireControls();
  wireDrop();
  var speed0 = parseFloat(P.speed);
  if (P.speed === 'max') PL.speed = 'max';
  else if (speed0 > 0) PL.speed = speed0;
  qs('#speeds').querySelectorAll('button').forEach(function (b) {
    setPressed(b, b.textContent === (PL.speed === 'max' ? 'max' : PL.speed + '×'));
  });

  var inline = loadInline();
  if (inline) expand(inline).then(mount)['catch'](fail);
  else if (P.src) {
    loadSrc(P.src.split(',').map(function (s) { return s.trim(); }).filter(Boolean))
      .then(expand).then(mount)['catch'](fail);
  }
})();
</script>
</body>
</html>
